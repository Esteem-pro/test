<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Анализ и Прогноз Лидов</title>
    <!-- Подключаем стили stlite -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Подключаем скрипт stlite -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          // Указываем нужные Python библиотеки (openpyxl нужен для Excel файлов)
          requirements: ["pandas", "numpy", "scipy", "matplotlib", "openpyxl", "streamlit"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py" // Подтягиваем ваш файл из репозитория
            }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
