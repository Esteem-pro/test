/* ================= command palette ================= */
function CommandPalette({tasks,channels,projects,onSelect,onClose}){
  const [q,setQ]=useState('');
  const [hl,setHl]=useState(0);
  const inputRef=useRef(null);
  useEffect(()=>{inputRef.current&&inputRef.current.focus();},[]);
  useEffect(()=>{setHl(0);},[q]);
  const qq=q.trim().toLowerCase();
  const items=useMemo(()=>{
    const base=[];
    tasks.forEach(t=>{
      const ch=channels[t.ch];
      const pr=projects[t.project];
      base.push({kind:'task',id:t.id,label:t.title,
        sub:`${ch?.label||'—'} · ${pr?.name||'без проекта'} · ${colMeta(t).t}`,
        color:ch?.c||'#98A29B',icon:IC.board});
    });
    Object.entries(channels).forEach(([k,c])=>
      base.push({kind:'channel',id:k,label:`Канал: ${c.label}`,sub:'Фильтр по каналу',color:c.c,icon:IC.board}));
    Object.entries(projects).forEach(([k,p])=>!p.archived&&
      base.push({kind:'project',id:k,label:`Проект: ${p.name}`,sub:'Фильтр по проекту',color:p.c,icon:IC.target}));
    base.push({kind:'view',id:'mine',label:'Мои задачи',sub:'Перейти',color:'#2E6BFF',icon:IC.user});
    base.push({kind:'view',id:'cal',label:'Календарь',sub:'Перейти',color:'#2E6BFF',icon:IC.cal});
    base.push({kind:'view',id:'stats',label:'Аналитика',sub:'Перейти',color:'#2E6BFF',icon:IC.chart});
    base.push({kind:'view',id:'fav',label:'Избранное',sub:'Перейти',color:'#E8930C',icon:IC.star});
    base.push({kind:'view',id:'tpl',label:'Шаблоны',sub:'Перейти',color:'#8B5CF6',icon:IC.template});
    base.push({kind:'action',id:'new',label:'Создать задачу',sub:'Действие',color:'#FF5A2D',icon:IC.plus});
    if(!qq) return base.slice(0,12);
    return base.filter(x=>(x.label+' '+x.sub).toLowerCase().includes(qq)).slice(0,15);
  },[tasks,channels,projects,qq]);

  const handleKey=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();setHl(h=>Math.min(items.length-1,h+1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setHl(h=>Math.max(0,h-1));}
    else if(e.key==='Enter'){e.preventDefault();items[hl]&&onSelect(items[hl]);}
    else if(e.key==='Escape'){onClose();}
  };
  return <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}} style={{alignItems:'flex-start',paddingTop:'15vh'}}>
    <div className="cmd" onClick={e=>e.stopPropagation()}>
      <div className="cmd-in">
        <Icon d={IC.search} size={16}/>
        <input ref={inputRef} placeholder="Поиск задач, проектов, каналов…"
          value={q} onChange={e=>setQ(e.target.value)} onKeyDown={handleKey}/>
        <span style={{font:'500 10px Golos Text',color:'var(--mut)',padding:'2px 6px',background:'var(--soft)',borderRadius:6}}>ESC</span>
      </div>
      <div className="cmd-list">
        {items.length===0&&<div style={{padding:'20px',textAlign:'center',color:'var(--mut)',fontSize:12.5}}>Ничего не найдено</div>}
        {items.map((it,i)=>
          <div key={it.kind+it.id} className={'cmd-item'+(i===hl?' hl':'')}
            onClick={()=>onSelect(it)} onMouseEnter={()=>setHl(i)}>
            <div className="ci-ic" style={{color:it.color}}><Icon d={it.icon} size={14}/></div>
            <span className="ci-t">{it.label}</span>
            <span className="ci-s">{it.sub}</span>
          </div>)}
      </div>
    </div>
  </div>;
}

/* ================= быстрый дропдаун на карточке ================= */
function QuickDropdown({target,kind,onSelect,onClose,options,currentValue}){
  const ref=useRef(null);
  useEffect(()=>{
    const h=e=>{if(!ref.current?.contains(e.target))onClose();};
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[]);
  const rect=target?.getBoundingClientRect();
  if(!rect) return null;
  return <div ref={ref} className="qdd" style={{
    position:'fixed',
    left:Math.min(rect.left,window.innerWidth-260)+'px',
    top:(rect.bottom+4)+'px'}}>
    {options.map(o=>
      <button key={o.value} className={o.value===currentValue?'on':''}
        onClick={()=>{onSelect(o.value);onClose();}}>
        {o.color&&<span className="dot" style={{background:o.color}}/>}
        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{o.label}</span>
      </button>)}
  </div>;
}

function TaskModal({init,live,defaultBoard,defaultCol,defaultDue,onClose,onSave,onDelete,onSaveAsTemplate}){
  const {channels,members,me,now,toggleTimer,resetTimer,projects,taskTypes} = useCtx();
  const firstCh=Object.keys(channels)[0];
  const firstWho=Object.keys(members)[0];
  const firstProject=Object.keys(projects).find(k=>!projects[k].archived)||null;
  const [f,setF]=useState(()=> init
    ? {...init, sub:init.sub.map(s=>({...s})), coms:[...init.coms], tags:[...(init.tags||[])],
        types:[...(init.types||[])]}
    : {id:null,board:defaultBoard||'main',col:defaultCol||colsOf(defaultBoard||'main')[0].id,
       title:'',desc:'',ch:firstCh,who:firstWho,pr:'mid',
       due:defaultDue||iso(addDays(3)),sub:[],coms:[],tags:[],types:[],repeat:'none',
       time:null,project:firstProject});
  const [comText,setComText]=useState('');
  const [tagInput,setTagInput]=useState('');
  const [ttInput,setTtInput]=useState('');
  const [ttColor,setTtColor]=useState('#2E6BFF');
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape') onClose();};
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[]);
  const subDone=f.sub.filter(s=>s.done).length;
  const setSub=(i,patch)=>setF(s=>({...s,sub:s.sub.map((x,j)=>j===i?{...x,...patch}:x)}));
  const addSub=t=>setF(s=>({...s,sub:[...s.sub,{t,done:false}]}));
  const addTag=v=>{
    const tg=v.trim().toLowerCase().replace(/^#/,'');
    if(!tg||f.tags.includes(tg)) return;
    setF(s=>({...s,tags:[...s.tags,tg]}));
  };
  const toggleType=tid=>{
    setF(s=>{
      const types=s.types||[];
      return {...s,types:types.includes(tid)?types.filter(x=>x!==tid):[...types,tid]};
    });
  };
  const addCom=()=>{
    if(!comText.trim()) return;
    setF(s=>({...s,coms:[...s.coms,{who:me,ts:Date.now(),text:comText.trim()}]}));
    setComText('');
  };
  const ok=f.title.trim().length>0;
  const liveRunning=live&&live.time&&live.time.run;

  const handleAddType=()=>{
    const label=ttInput.trim();
    if(!label) return;
    onSave({kind:'new-type',label,c:ttColor,form:f});
    setTtInput('');

    <div className="modal">
      <button className="mclose" onClick={onClose}><Icon d={IC.x} size={16}/></button>
      <h3>{init?'Редактировать задачу':'Новая задача'}</h3>
      <div className="f">

        <label>Описание</label>
        <textarea rows="2" placeholder="Детали, ссылки, критерии готовности…" value={f.desc} onChange={e=>set('desc',e.target.value)}/>
        <div className="frow">
          <div>
            <label>Доска</label>
            <div className="seg" style={{height:'auto'}}>
              {Object.entries(BOARDS).map(([k,b])=>
                <button key={k} type="button" className={f.board===k?'on':''}
                  onClick={()=>setF(s=>({...s,board:k,col:colsOf(k)[0].id}))}>{b.title}</button>)}
            </div>
          </div>
          <div>
            <label>Проект</label>
            <select value={f.project||''} onChange={e=>set('project',e.target.value||null)}
              style={{width:'100%',border:'1px solid var(--line)',borderRadius:10,padding:'10px 12px',
                font:"500 14px 'Golos Text'",color:'var(--ink)',background:'var(--field)',outline:'none'}}>
              <option value="">— Без проекта —</option>
              {Object.entries(projects).filter(([k,p])=>!p.archived).map(([k,p])=>
                <option key={k} value={k}>{p.name}</option>)}

          </div>
        </div>
        <div className="frow">
          <div>
            <label>Канал</label>
            <div className="chipsel">
              {Object.entries(channels).map(([k,c])=>
                <button key={k} type="button"
                  style={f.ch===k?{background:cmix(c.c,15),borderColor:c.c,color:c.c}:{}}
                  onClick={()=>set('ch',k)}>{c.label}</button>)}
            </div>
          </div>
          <div>
            <label>Исполнитель</label>
            <div className="avasel">

        {init&&<button className="btn danger" onClick={()=>onDelete(init.id)}><Icon d={IC.trash} size={14}/>Удалить</button>}
        {init&&<button className="btn ghost" onClick={()=>onSaveAsTemplate&&onSaveAsTemplate(init)}
          title="Сохранить как шаблон"><Icon d={IC.template} size={14}/>Шаблон</button>}
        <span style={{flex:1}}/>
        <button className="btn ghost" onClick={onClose}>Отмена</button>
        <button className="btn pri" disabled={!ok} onClick={()=>onSave(f)}>{init?'Сохранить':'Создать задачу'}</button>
      </div>
    </div>
  </div>;
}

  });
  const [me,setMe]=useState(()=>{
    const src=saved.members&&Object.keys(saved.members).length?saved.members:DEFAULT_MEMBERS;
    return saved.me&&src[saved.me]?saved.me:Object.keys(src)[0];
  });
  const [sprint,setSprint]=useState(saved.sprint||DEFAULT_SPRINT);
  const [projects,setProjects]=useState(saved.projects&&Object.keys(saved.projects).length?saved.projects:DEFAULT_PROJECTS);
  const [taskTypes,setTaskTypes]=useState(saved.taskTypes&&Object.keys(saved.taskTypes).length?saved.taskTypes:DEFAULT_TASK_TYPES);
  const [templates,setTemplates]=useState(saved.templates&&saved.templates.length?saved.templates:DEFAULT_TEMPLATES);
  const [cardFields,setCardFields]=useState(saved.cardFields||DEFAULT_CARD_FIELDS);
  const [scratch,setScratch]=useState(saved.scratch||'');
  const [q,setQ]=useState('');
  const [chF,setChF]=useState([]);
  const [whoF,setWhoF]=useState([]);
  const [tagF,setTagF]=useState([]);
  const [prjF,setPrjF]=useState([]);
  const [tagMode,setTagMode]=useState('any');
  const [prF,setPrF]=useState('all');
  const [dueF,setDueF]=useState('all');
  const [modal,setModal]=useState(null);
  const [toasts,setToasts]=useState([]);
  const [notifOpen,setNotifOpen]=useState(false);
  const [now,setNow]=useState(Date.now());
  const [showCardSettings,setShowCardSettings]=useState(false);
  const [quickDD,setQuickDD]=useState(null);
  const [selectedIds,setSelectedIds]=useState([]);
  const [cmdOpen,setCmdOpen]=useState(false);
  const kRef=useRef(0);
  const searchRef=useRef(null);

  /* тема и ui */
  useEffect(()=>{document.documentElement.classList.toggle('dark',theme==='dark');},[theme]);
  useEffect(()=>{
    try{localStorage.setItem(LS_KEY,JSON.stringify({
      tasks,log,channels,members,me,sprint,projects,taskTypes,templates,cardFields,scratch,theme,
      ui:{mode,group,sort}}));}catch(e){}
  },[tasks,log,channels,members,me,sprint,projects,taskTypes,templates,cardFields,scratch,theme,mode,group,sort]);

  /* тик таймеров */
  const anyRunning=useMemo(()=>tasks.some(t=>t.time&&t.time.run),[tasks]);
  useEffect(()=>{
    if(!anyRunning) return;
    setNow(Date.now());
    const iv=setInterval(()=>setNow(Date.now()),1000);
    return ()=>clearInterval(iv);
  },[anyRunning]);

  const toggleTimer=id=>{
    const t=tasks.find(x=>x.id===id); if(!t) return;
    const wasRunning=t.time&&t.time.run;
    setTasks(ts=>ts.map(x=>{
      if(x.id===id){
        const cur=x.time||{s:0,run:null};
        if(cur.run) return {...x,time:{s:cur.s+Math.round((Date.now()-cur.run)/1000),run:null}};
        return {...x,time:{s:cur.s,run:Date.now()}};
      }
      if(x.time&&x.time.run) return {...x,time:{s:x.time.s+Math.round((Date.now()-x.time.run)/1000),run:null}};
      return x;
    }));
    if(!wasRunning) toast(`Таймер запущен: «${t.title.length>30?t.title.slice(0,30)+'…':t.title}»`);
  };
  const resetTimer=id=>{
    setTasks(ts=>ts.map(x=>x.id===id?{...x,time:{s:0,run:null}}:x));
    toast('Таймер сброшен');
  };

  const ctx=useMemo(()=>({channels,members,me,now,toggleTimer,resetTimer,projects,taskTypes,cardFields}),
    [channels,members,me,now,tasks,projects,taskTypes,cardFields]);

  const toast=(msg,action,type)=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,action,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3400);
  };
  const killToast=id=>setToasts(t=>t.filter(x=>x.id!==id));
  const logEv=(type,text)=>setLog(l=>[{id:'e'+Date.now()+Math.random().toString(16).slice(2),ts:Date.now(),type,text},...l].slice(0,160));
  const toggle=(val,cur,set)=>set(cur.includes(val)?cur.filter(x=>x!==val):[...cur,val]);
  const resetF=()=>{setQ('');setChF([]);setWhoF([]);setTagF([]);setPrjF([]);setPrF('all');setDueF('all');};
  const hasF=!!(q.trim()||chF.length||whoF.length||tagF.length||prjF.length||prF!=='all'||dueF!=='all');
  const openModal=m=>setModal({...m,k:++kRef.current});

  const warned=useRef(false);
  useEffect(()=>{
    if(warned.current) return; warned.current=true;
    const n=tasks.filter(t=>!isDone(t)&&daysLeft(t.due)<0).length;
    if(n>0) setTimeout(()=>toast(`Просроченных задач: ${n} — загляните в колокольчик`),800);
  },[]);

  /* горячие клавиши */
  useEffect(()=>{
    const h=e=>{
      if(e.key==='Escape'){setNotifOpen(false);setCmdOpen(false);setQuickDD(null);return;}
      const tag=(e.target.tagName||'').toLowerCase();
      const inInput=tag==='input'||tag==='textarea'||tag==='select';
      if(e.metaKey||e.ctrlKey){
        if(e.key==='k'||e.key==='K'||e.key==='л'||e.key==='Л'){e.preventDefault();setCmdOpen(true);return;}
        return;
      }
      if(e.altKey) return;
      if(modal) return;
      if(inInput) return;
      if(e.key==='/'){e.preventDefault();setView('board');setTimeout(()=>searchRef.current&&searchRef.current.focus(),30);}
      else if(e.key==='n'||e.key==='т') openModal({mode:'new',board:'main'});
      else if(e.key==='t'||e.key==='е') setTheme(t=>t==='dark'?'light':'dark');
      else{
        const v={'1':'board','2':'photo','3':'video','4':'mine','5':'cal','6':'stats','7':'files','8':'feed','9':'admin','0':'fav'}[e.key];
        if(v) setView(v);
      }
    };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[modal]);

  /* фильтры */
  const base=useMemo(()=>tasks.filter(t=>{
    if(chF.length&&!chF.includes(t.ch)) return false;
    if(whoF.length&&!whoF.includes(t.who)) return false;
    if(prjF.length&&!prjF.includes(t.project)) return false;
    if(tagF.length){
      const tt=t.tags||[];
      if(tagMode==='all'?!tagF.every(tg=>tt.includes(tg)):!tagF.some(tg=>tt.includes(tg))) return false;
    }
    if(prF!=='all'&&t.pr!==prF) return false;
    if(q.trim()){
      const s=(t.title+' '+(t.desc||'')+' '+(t.tags||[]).join(' ')).toLowerCase();
      if(!s.includes(q.trim().toLowerCase())) return false;
    }
    return true;
  }),[tasks,q,chF,whoF,prjF,tagF,tagMode,prF]);

  const dueCounts=useMemo(()=>{
    const cnt={today:0,soon:0,week:0,over:0};
    base.forEach(t=>{
      const dl=daysLeft(t.due);
      if(dl<0&&!isDone(t)) cnt.over++;
      if(isDone(t)) return;
      if(dl===0) cnt.today++;
      if(dl>=0&&dl<=3) cnt.soon++;
      if(dl>=0&&dl<=7) cnt.week++;
    });
    return cnt;
  },[base]);

  const visible=useMemo(()=>base.filter(t=>{
    if(dueF==='all') return true;
    const dl=daysLeft(t.due);
    if(dueF==='over') return dl<0&&!isDone(t);
    if(isDone(t)) return false;
    if(dueF==='today') return dl===0;
    if(dueF==='soon')  return dl>=0&&dl<=3;
    if(dueF==='week')  return dl>=0&&dl<=7;
    return true;
  }),[base,dueF]);

  const sortFn=useMemo(()=>({
    'due-asc':(a,b)=>a.due.localeCompare(b.due),
    'due-desc':(a,b)=>b.due.localeCompare(a.due),
    'pr':(a,b)=>PRW[b.pr]-PRW[a.pr]||a.due.localeCompare(b.due),
    'ch':(a,b)=>((channels[a.ch]||{}).label||'').localeCompare((channels[b.ch]||{}).label||'','ru'),
    'who':(a,b)=>((members[a.who]||{}).short||'').localeCompare((members[b.who]||{}).short||'','ru'),
    'title':(a,b)=>a.title.localeCompare(b.title,'ru'),
    'pinned':(a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||a.due.localeCompare(b.due),
  }[sort]||(()=>0)),[sort,channels,members]);

  const tagList=useMemo(()=>{
    const map={};
    tasks.forEach(t=>(t.tags||[]).forEach(tg=>{map[tg]=(map[tg]||0)+1;}));
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  },[tasks]);

  const favCount=useMemo(()=>tasks.filter(t=>t.fav&&!isDone(t)).length,[tasks]);
  const tplCount=templates.length;

  /* уведомления */
  const notif=useMemo(()=>{
    const open=tasks.filter(t=>!isDone(t));
    return {
      over:open.filter(t=>daysLeft(t.due)<0).sort((a,b)=>a.due.localeCompare(b.due)),
      today:open.filter(t=>daysLeft(t.due)===0),
      tomorrow:open.filter(t=>daysLeft(t.due)===1),
    };
  },[tasks]);
  const notifCount=notif.over.length+notif.today.length;

  /* действия */
  const spawnRepeat=t=>{
    const nd=nextDue(t.due,t.repeat);
    const nt={...t,id:_id++,col:colsOf(t.board||'main')[0].id,due:nd,time:null,coms:[],
      sub:(t.sub||[]).map(s=>({...s,done:false})),pinned:false,fav:false};
    setTasks(ts=>[nt,...ts]);
    logEv('repeat',`Повтор: «${t.title}» → ${fmt(pdate(nd))}`);
    toast(`Повторяющаяся задача: следующий срок ${fmt(pdate(nd))}`);
  };
  const moveTo=(id,col)=>{
    const t=tasks.find(x=>x.id===id);
    if(!t||t.col===col) return;
    setTasks(ts=>ts.map(x=>x.id===id?{...x,col}:x));
    const ct=(colsOf(t.board||'main').find(c=>c.id===col)||{t:'?'}).t;
    if(col===doneCol(t.board||'main')){
      logEv('done',`«${t.title}» — готово`);
      toast(`Готово: «${t.title.length>28?t.title.slice(0,28)+'…':t.title}»`);
      if(t.repeat!=='none') spawnRepeat({...t,col});
    } else {
      logEv('move',`«${t.title}» → ${ct}`);
      toast(`Перенесено в «${ct}»`);
    }
  };
  const dayDrop=(id,bucket)=>{
    const t=tasks.find(x=>x.id===id); if(!t) return;
    if(bucket==='done'){moveTo(id,doneCol(t.board||'main'));return;}
    if(bucket==='over'){toast('Нельзя запланировать в прошлое');return;}
    const off={today:0,tomorrow:1,week:4,later:10}[bucket];
    const nd=iso(addDays(off));
    setTasks(ts=>ts.map(x=>x.id===id?{...x,due:nd}:x));
    const bl=(DAY_BUCKETS.find(b=>b.id===bucket)||{}).t;
    logEv('move',`«${t.title}» → ${bl}`);
    toast(`Дедлайн: ${bl.toLowerCase()}${bucket==='week'||bucket==='later'?' ('+fmt(pdate(nd))+')':''}`);
  };
  const togglePin=id=>{
    const t=tasks.find(x=>x.id===id); if(!t) return;
    setTasks(ts=>ts.map(x=>x.id===id?{...x,pinned:!x.pinned}:x));
    logEv('pin',`«${t.title}» ${t.pinned?'откреплена':'закреплена'}`);
    toast(t.pinned?'Задача откреплена':'Задача закреплена 📌');
  };
  const toggleFav=id=>{
    const t=tasks.find(x=>x.id===id); if(!t) return;
    setTasks(ts=>ts.map(x=>x.id===id?{...x,fav:!x.fav}:x));
    logEv('fav',`«${t.title}» ${t.fav?'убрана из избранного':'добавлена в избранное'}`);
    toast(t.fav?'Убрано из избранного':'Добавлено в избранное ⭐');
  };
  const saveTask=f=>{
    if(f&&f.kind==='new-type'){
      const id='tt'+Date.now().toString(36);
      setTaskTypes(tt=>({...tt,[id]:{label:f.label,c:f.c}}));
      setModal(m=>m?{...m,form:{...f.form,types:[...(f.form.types||[]),id]}}:m);
      toast(`Тип «${f.label}» создан`);
      return;
    }
    if(modal.mode==='edit'){
      const cur=tasks.find(x=>x.id===f.id);
      const merged={...f,time:cur?cur.time:null};
      setTasks(ts=>ts.map(x=>x.id===f.id?merged:x));
      logEv('edit',`Изменена «${f.title}»`);
      toast('Изменения сохранены');
      if(cur&&!isDone(cur)&&isDone(merged)&&merged.repeat!=='none') spawnRepeat(merged);
    } else {
      const t={...f,id:_id++};
      setTasks(ts=>[t,...ts]);
      logEv('create',`Создана «${t.title}»`);
      toast('Задача создана');
    }
    setModal(null);
  };
  const deleteTask=id=>{
    const t=tasks.find(x=>x.id===id);
    setTasks(ts=>ts.filter(x=>x.id!==id));
    setModal(null);
    logEv('del',`Удалена «${t.title}»`);
    toast('Задача удалена',{label:'Вернуть',fn:()=>{
      setTasks(ts=>[t,...ts]);
      logEv('create',`Восстановлена «${t.title}»`);
    }});
  };
  const saveAsTemplate=t=>{
    const name=prompt('Название шаблона:',t.title);
    if(!name) return;
    const tpl={id:'tpl'+Date.now(),name,desc:t.desc,
      data:{board:t.board,ch:t.ch,pr:t.pr,types:t.types,tags:t.tags,
        sub:t.sub.map(s=>({t:s.t,done:false})),repeat:t.repeat,project:t.project}};
    setTemplates(ts=>[tpl,...ts]);
    logEv('admin',`Создан шаблон «${name}»`);
    toast('Шаблон сохранён в библиотеку');
  };
  const useTemplate=tpl=>{
    const t={...tpl.data,id:_id++,title:'Задача из шаблона: '+tpl.name,
      col:colsOf(tpl.data.board||'main')[0].id,due:iso(addDays(3)),coms:[],time:null,pinned:false,fav:false};
    setTasks(ts=>[t,...ts]);
    logEv('create',`Создана из шаблона «${tpl.name}»`);
    toast('Задача создана из шаблона');
    openModal({mode:'edit',t});
  };
  const delTemplate=id=>{
    setTemplates(ts=>ts.filter(x=>x.id!==id));
    toast('Шаблон удалён');
  };
  const resetDemo=()=>{
    try{localStorage.removeItem(LS_KEY);}catch(e){}
    setTasks(SEED.map(normTask)); setLog(SEED_LOG);
    setChannels(DEFAULT_CHANNELS); setMembers(DEFAULT_MEMBERS);
    setProjects(DEFAULT_PROJECTS); setTaskTypes(DEFAULT_TASK_TYPES);
    setTemplates(DEFAULT_TEMPLATES); setCardFields(DEFAULT_CARD_FIELDS);
    setScratch('');
    setMe('ak'); setSprint(DEFAULT_SPRINT);
    resetF(); setSelectedIds([]);
    toast('Демо-данные восстановлены');
  };

  /* быстрые действия на карточке */
  const handleFieldClick=(field,taskId,e)=>{
    const target=e?.currentTarget;
    setQuickDD({field,taskId,target});
  };
  const applyQuick=(value)=>{
    if(!quickDD) return;
    const {field,taskId}=quickDD;
    const t=tasks.find(x=>x.id===taskId); if(!t) return;
    if(field==='channel'){
      setTasks(ts=>ts.map(x=>x.id===taskId?{...x,ch:value}:x));
      toast(`Канал: ${channels[value].label}`);
    } else if(field==='assignee'){
      setTasks(ts=>ts.map(x=>x.id===taskId?{...x,who:value}:x));
      toast(`Исполнитель: ${members[value].short}`);
    } else if(field==='priority'){
      setTasks(ts=>ts.map(x=>x.id===taskId?{...x,pr:value}:x));
      toast(`Приоритет: ${PR[value].label}`);
    } else if(field==='project'){
      setTasks(ts=>ts.map(x=>x.id===taskId?{...x,project:value||null}:x));
      toast(value?`Проект: ${projects[value].name}`:'Проект снят');
    } else if(field==='types'){
      openModal({mode:'edit',t});
    } else if(field==='due'){
      openModal({mode:'edit',t});
    }
  };

  const quickOptions=useMemo(()=>{
    if(!quickDD) return [];
    const t=tasks.find(x=>x.id===quickDD.taskId);
    if(quickDD.field==='channel') return Object.entries(channels).map(([k,c])=>({value:k,label:c.label,color:c.c}));
    if(quickDD.field==='assignee') return Object.entries(members).map(([k,m])=>({value:k,label:m.name,color:m.c}));
    if(quickDD.field==='priority') return [['high','▲ Высокий'],['mid','● Средний'],['low','▽ Низкий']].map(([v,l])=>({value:v,label:l,color:PR[v].c}));
    if(quickDD.field==='project') return [{value:null,label:'— Без проекта —',color:'#98A29B'},
      ...Object.entries(projects).filter(([k,p])=>!p.archived).map(([k,p])=>({value:k,label:p.name,color:p.c}))];
    return [];
  },[quickDD,channels,members,projects]);

  /* выделение */
  const toggleSelect=id=>setSelectedIds(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const shiftSelect=id=>{
    setSelectedIds(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  };
  const clearSelection=()=>setSelectedIds([]);

  /* command palette */
  const handleCmdSelect=item=>{
    setCmdOpen(false);
    if(item.kind==='task'){
      const t=tasks.find(x=>x.id===item.id);
      if(t) openModal({mode:'edit',t});
    } else if(item.kind==='view'){
      setView(item.id);
    } else if(item.kind==='channel'){
      setChF([item.id]);
    } else if(item.kind==='project'){
      setPrjF([item.id]);
    } else if(item.kind==='action'){
      if(item.id==='new') openModal({mode:'new',board:'main'});
    }
  };

  /* производные для текущей доски */
  const isBoardView = view==='board'||view==='photo'||view==='video';
  const bkey = view==='board'?'main':view;
  const btAll = useMemo(()=>tasks.filter(t=>(t.board||'main')===bkey),[tasks,bkey]);
  const btVisible = useMemo(()=>visible.filter(t=>(t.board||'main')===bkey),[visible,bkey]);
  const btSorted = useMemo(()=>{
    const pinned=btVisible.filter(t=>t.pinned&&!isDone(t));
    const rest=btVisible.filter(t=>!t.pinned||isDone(t));
    return [...pinned.sort(sortFn),...rest.sort(sortFn)];
  },[btVisible,sortFn]);
  const runningTask = tasks.find(t=>t.time&&t.time.run);

  const VIEW_H={board:'Основная доска', photo:'Доска · Фото', video:'Доска · Видео', mine:'Мои задачи',
                fav:'Избранное',cal:'Календарь дедлайнов', stats:'Аналитика', files:'Файлы команды',
                tpl:'Шаблоны задач', feed:'История изменений', admin:'Админ-панель'};

  const NotifRow=({t})=>{
    const ch=channels[t.ch]||{c:'#98A29B'};
    return <button className="bp-row" onClick={()=>{openModal({mode:'edit',t});setNotifOpen(false);}}>
      <span className="dot" style={{background:ch.c}}/>
      <span className="t">{t.title}</span>
      <span className="d">{daysLeft(t.due)<0?`${-daysLeft(t.due)} д назад`:'сегодня'}</span>
    </button>;
  };
  const Achip=({children,onX,dot})=>
    <span className="achip">{dot&&<span className="dot" style={{background:dot,width:7,height:7}}/>}
      <span className="l">{children}</span>
      <button onClick={onX}><Icon d={IC.x} size={10} sw={2.6}/></button></span>;

  /* массовые действия */
  const massMoveTo=col=>{
    setTasks(ts=>ts.map(x=>selectedIds.includes(x.id)?{...x,col}:x));
    toast(`Перемещено задач: ${selectedIds.length}`);
    clearSelection();
  };
  const massDelete=()=>{
    if(!confirm(`Удалить ${selectedIds.length} задач?`)) return;
    setTasks(ts=>ts.filter(x=>!selectedIds.includes(x.id)));
    toast(`Удалено задач: ${selectedIds.length}`);
    clearSelection();
  };
  const massPin=()=>{
    setTasks(ts=>ts.map(x=>selectedIds.includes(x.id)?{...x,pinned:true}:x));
    toast(`Закреплено: ${selectedIds.length}`);
    clearSelection();
  };

  return (
  <Ctx.Provider value={ctx}>
  <div className="app">
    <Sidebar view={view} setView={setView} tasks={tasks} chF={chF} whoF={whoF} tagF={tagF}
      onCh={k=>toggle(k,chF,setChF)} onWho={k=>toggle(k,whoF,setWhoF)} onTag={tg=>toggle(tg,tagF,setTagF)}
      tags={tagList} tagMode={tagMode} setTagMode={setTagMode}
      resetDemo={resetDemo} sprint={sprint} me={me}
      scratch={scratch} setScratch={setScratch}
      projects={projects} favCount={favCount} tplCount={tplCount}
      selectedIds={selectedIds}/>

    <main className="main">
      <header className="topbar">
        <div>
          <span className="kicker"><i/>Поток · команда маркетинга</span>
          <h1>{VIEW_H[view]}<em>.</em></h1>
        </div>
        <div className="tools">
          {isBoardView&&<>
            <label className="search">
              <Icon d={IC.search} size={15}/>
              <input ref={searchRef} placeholder="Поиск…  ( / )" value={q} onChange={e=>setQ(e.target.value)}/>
              {q&&<button className="x" onClick={()=>setQ('')}><Icon d={IC.x} size={13}/></button>}
            </label>
            <div className="seg">
              {[['all','Все'],['high','▲ Высокий'],['mid','● Средний'],['low','▽ Низкий']].map(([v,l])=>
                <button key={v} className={prF===v?'on':''} onClick={()=>setPrF(v)}>{l}</button>)}
            </div>
          </>}
          {runningTask&&<button className="livechip" title="Открыть задачу"
              onClick={()=>openModal({mode:'edit',t:runningTask})}>
            <span className="rdot"/><span className="lct">{runningTask.title}</span><b>{fmtDur(elapsed(runningTask,now))}</b>
          </button>}
          {selectedIds.length>0&&<div style={{display:'flex',gap:6,alignItems:'center'}}>
            <span style={{font:'600 12px Golos Text',color:'var(--accent)'}}>Выбрано: {selectedIds.length}</span>
            <button className="btn xs ghost" onClick={()=>massPin()}><Icon d={IC.pin} size={11}/>Закрепить</button>
            <select className="sortsel" style={{padding:'6px 10px',fontSize:11}} value=""
              onChange={e=>{if(e.target.value)massMoveTo(e.target.value);e.target.value='';}}>
              <option value="">Переместить…</option>
              {colsOf(bkey).map(c=><option key={c.id} value={c.id}>{c.t}</option>)}
            </select>
            <button className="btn xs danger" onClick={massDelete}><Icon d={IC.trash} size={11}/>Удалить</button>
            <button className="btn xs ghost" onClick={clearSelection}>Снять</button>
          </div>}
          <div className="bellwrap">
            <button className={'iconbtn'+(notifCount>0?' has':'')} title="Уведомления" onClick={()=>setNotifOpen(o=>!o)}>
              <Icon d={IC.bell} size={17}/>{notifCount>0&&<span className="bbadge">{notifCount}</span>}
            </button>
            {notifOpen&&<>
              <div className="bback" onClick={()=>setNotifOpen(false)}/>
              <div className="bpanel">
                <div className="bp-head"><b>Требуют внимания</b>{notifCount>0&&<span>{notifCount}</span>}</div>
                {notifCount===0&&notif.tomorrow.length===0&&<div className="bp-empty">Всё спокойно — горящих дедлайнов нет 🎉</div>}
                {notif.over.length>0&&<><div className="bp-sec">Просрочено</div>{notif.over.map(t=><NotifRow key={t.id} t={t}/>)}</>}
                {notif.today.length>0&&<><div className="bp-sec">Сегодня</div>{notif.today.map(t=><NotifRow key={t.id} t={t}/>)}</>}
                {notif.tomorrow.length>0&&<><div className="bp-sec">Завтра</div>{notif.tomorrow.map(t=><NotifRow key={t.id} t={t}/>)}</>}
                {notif.over.length>0&&<button className="bp-all" onClick={()=>{setView('board');setMode('board');setGroup('day');setDueF('over');setNotifOpen(false);}}>
                  Показать просроченные →</button>}
              </div>
            </>}
          </div>
          <button className="iconbtn" title="Настройки карточки" onClick={()=>setShowCardSettings(true)}>
            <Icon d={IC.cog} size={16}/>
          </button>
          <button className="iconbtn" title="Command Palette (Ctrl+K)" onClick={()=>setCmdOpen(true)}>
            <Icon d={IC.bolt} size={16}/>
          </button>
          <button className="iconbtn" title="Переключить тему (T)" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}>
            <Icon d={theme==='dark'?IC.sun:IC.moon} size={16}/>
          </button>
          <button className="btn pri" onClick={()=>openModal({mode:'new',board:isBoardView?bkey:'main'})}>
            <Icon d={IC.plus} size={15} sw={2.4}/>Новая задача
          </button>
        </div>
      </header>

      {hasF&&<div className="fbar">
        {q.trim()&&<Achip onX={()=>setQ('')}>Поиск: «{q.trim()}»</Achip>}
        {chF.map(k=><Achip key={k} dot={(channels[k]||{c:'#999'}).c} onX={()=>toggle(k,chF,setChF)}>{(channels[k]||{label:k}).label}</Achip>)}
        {whoF.map(k=><Achip key={k} dot={(members[k]||{c:'#999'}).c} onX={()=>toggle(k,whoF,setWhoF)}>{(members[k]||{short:k}).short}</Achip>)}
        {prjF.map(k=><Achip key={k} dot={(projects[k]||{c:'#999'}).c} onX={()=>toggle(k,prjF,setPrjF)}>{(projects[k]||{name:k}).name}</Achip>)}
        {tagF.map(tg=><Achip key={tg} onX={()=>toggle(tg,tagF,setTagF)}>#{tg}</Achip>)}
        {tagF.length>1&&<span className="fbar-note">теги: {tagMode==='any'?'любой из':'все сразу'}</span>}
        {prF!=='all'&&<Achip onX={()=>setPrF('all')}>Приоритет: {PR[prF].label}</Achip>}
        {dueF!=='all'&&<Achip onX={()=>setDueF('all')}>{(DUE_OPTS.find(d=>d[0]===dueF)||[])[1]}</Achip>}
        <button className="achip clear" onClick={resetF}>Сбросить всё</button>
      </div>}

      {isBoardView&&<>
        <div className="ctrl">
          <div className="vseg">
            <button className={mode==='board'?'on':''} onClick={()=>setMode('board')}><Icon d={IC.kanban} size={13}/>Доска</button>
            <button className={mode==='list'?'on':''} onClick={()=>setMode('list')}><Icon d={IC.list} size={13}/>Список</button>
          </div>
          <div className="vseg" title="Группировка колонок">
            <button className={group==='status'?'on':''} onClick={()=>setGroup('status')}>По статусу</button>
            <button className={group==='day'?'on':''} onClick={()=>setGroup('day')}>По дням</button>
          </div>
          <div className="fchips">
            {DUE_OPTS.map(([v,l])=>
              <button key={v} className={'fchip'+(dueF===v?' on':'')} onClick={()=>setDueF(v)}>
                {l}{v!=='all'&&dueCounts[v]>0&&<b>{dueCounts[v]}</b>}
              </button>)}
          </div>
          <span style={{flex:1}}/>
          <select className="sortsel" value={sort} onChange={e=>setSort(e.target.value)} title="Сортировка">
            <option value="pinned">Закреплённые сверху</option>
            <option value="due-asc">Дедлайн ↑</option>
            <option value="due-desc">Дедлайн ↓</option>
            <option value="pr">Приоритет</option>
            <option value="ch">Канал</option>
            <option value="who">Исполнитель</option>
            <option value="title">Название</option>
          </select>
        </div>
        <section className="stats">
          <Stat lbl="Открыто" n={btAll.filter(t=>!isDone(t)).length} sub={`из ${btAll.length} на доске`} c="var(--blue)"/>
          <Stat lbl="Горит" n={btAll.filter(t=>!isDone(t)&&daysLeft(t.due)>=0&&daysLeft(t.due)<=2).length} sub="дедлайн ≤ 2 дней" c="var(--amber)"/>
          <Stat lbl="Просрочено" n={btAll.filter(t=>!isDone(t)&&daysLeft(t.due)<0).length} sub={btAll.filter(t=>!isDone(t)&&daysLeft(t.due)<0).length?'требует внимания':'всё по плану'} c="var(--red)" alert={btAll.filter(t=>!isDone(t)&&daysLeft(t.due)<0).length>0}/>
          <Stat lbl="Готово" n={btAll.filter(t=>isDone(t)).length} sub="завершено" c="var(--green)"/>
          <div className="ringbox">
            <Ring pct={btAll.length?btAll.filter(t=>isDone(t)).length/btAll.length:0}/>
            <div><b>{BOARDS[bkey].title}</b><small>{group==='day'?'группировка по дням':'группировка по статусу'}</small></div>
          </div>
        </section>

        {btVisible.some(t=>t.pinned&&!isDone(t))&&<div className="pinned">
          <h3><Icon d={IC.pin} size={13}/>Закреплённые</h3>
          <div className="pinned-grid">
            {btVisible.filter(t=>t.pinned&&!isDone(t)).map(t=>
              <TaskCard key={t.id} t={t} onEdit={t2=>openModal({mode:'edit',t:t2})}
                onPin={togglePin} onFav={toggleFav} onFieldClick={handleFieldClick}
                cardFields={cardFields} selected={selectedIds.includes(t.id)}
                onToggleSelect={toggleSelect} onShiftClick={shiftSelect}/>
            )}
          </div>
        </div>}

        {mode==='board'
          ? <Kanban all={btAll} visible={btSorted.filter(t=>!t.pinned||isDone(t))} group={group} hasF={hasF}
              cols={group==='day'?DAY_BUCKETS:colsOf(bkey)}
              onEdit={t=>openModal({mode:'edit',t})}
              onNew={col=>openModal({mode:'new',board:bkey,col})}
              onDropCard={(id,cid)=>group==='day'?dayDrop(id,cid):moveTo(id,cid)}
              onPin={togglePin} onFav={toggleFav} onFieldClick={handleFieldClick}
              selectedIds={selectedIds} onToggleSelect={toggleSelect} onShiftClick={shiftSelect}/>
          : btSorted.length>0
            ? (group==='status'
              ? <div className="ltab">
                  <div className="lrow lhead">
                    <div>Задача</div><div>Канал</div><div>Исполнитель</div><div>Дедлайн</div><div>Прогресс</div><div>Статус</div>
                  </div>
                  {btSorted.map(t=><TaskRow key={t.id} t={t} onEdit={t2=>openModal({mode:'edit',t:t2})} onMove={moveTo}/>)}
                </div>
              : DAY_BUCKETS.map((b,gi)=>{
                  const list=btSorted.filter(t=>bucketOf(t)===b.id);
                  if(!list.length) return null;
                  return <div key={b.id} className="mgroup" style={{animationDelay:`${gi*60}ms`}}>
                    <div className="mgt"><span className="col-dot" style={{background:b.c}}/><h4>{b.t}</h4><span className="n">{list.length}</span></div>
                    <div className="ltab">{list.map(t=><TaskRow key={t.id} t={t} onEdit={t2=>openModal({mode:'edit',t:t2})} onMove={moveTo}/>)}</div>
                  </div>;
                }))
            : null}
        {btSorted.length===0&&<div className="nothing"><b>Ничего не нашлось</b>Попробуйте изменить фильтры или поисковый запрос</div>}
      </>}

      {view==='mine'&&<MineView tasks={tasks} onEdit={t=>openModal({mode:'edit',t})} onMove={moveTo}/>}
      {view==='fav'&&<FavoritesView tasks={tasks} onEdit={t=>openModal({mode:'edit',t})} onMove={moveTo}/>}
      {view==='cal'&&<CalendarView tasks={tasks}
        onEdit={t=>openModal({mode:'edit',t})}
        onNew={d=>openModal({mode:'new',board:'main',due:d})}/>}
      {view==='stats'&&<StatsView tasks={tasks}/>}
      {view==='tpl'&&<TemplatesView templates={templates} onUse={useTemplate} onDelete={delTemplate}
        onCreate={()=>openModal({mode:'new',board:'main'})}/>}
      {view==='files'&&<FilesView tasks={tasks} onOpenTask={t=>openModal({mode:'edit',t})} toast={toast}/>}
      {view==='feed'&&<FeedView log={log} onClear={()=>{setLog([]);toast('История очищена');}}/>}
      {view==='admin'&&((members[me]||{}).role==='admin'
        ? <AdminView tasks={tasks} setTasks={setTasks} channels={channels} setChannels={setChannels}
            members={members} setMembers={setMembers} me={me} setMe={setMe} sprint={sprint} setSprint={setSprint}
            projects={projects} setProjects={setProjects} taskTypes={taskTypes} setTaskTypes={setTaskTypes}
            setLog={setLog} setChF={setChF} setWhoF={setWhoF} logEv={logEv} toast={toast} resetDemo={resetDemo}/>
        : <LockScreen login={k=>{setMe(k);logEv('admin',`Админ: вошли как ${members[k].name}`);toast(`Вы вошли как ${members[k].name} (админ)`);}}/>)}
    </main>

    {modal&&<TaskModal key={modal.k}
      init={modal.mode==='edit'?modal.t:null}
      live={modal.mode==='edit'?tasks.find(x=>x.id===modal.t.id):null}
      defaultBoard={modal.board} defaultCol={modal.col} defaultDue={modal.due}
      onClose={()=>setModal(null)} onSave={saveTask} onDelete={deleteTask} onSaveAsTemplate={saveAsTemplate}/>}

    {showCardSettings&&<CardSettings cardFields={cardFields} setCardFields={setCardFields}
      onClose={()=>setShowCardSettings(false)}/>}

    {cmdOpen&&<CommandPalette tasks={tasks} channels={channels} projects={projects}
      onSelect={handleCmdSelect} onClose={()=>setCmdOpen(false)}/>}

    {quickDD&&<QuickDropdown target={quickDD.target} kind={quickDD.field}
      options={quickOptions} currentValue={tasks.find(t=>t.id===quickDD.taskId)?.[quickDD.field]}
      onSelect={applyQuick} onClose={()=>setQuickDD(null)}/>}

    <div className="toasts">
      {toasts.map(t=>
        <div key={t.id} className={'toast'+(t.type==='warn'?' warn':'')}>
          <span className="tdot"/>{t.msg}
          {t.action&&<button className="tact" onClick={()=>{t.action.fn();killToast(t.id);}}>{t.action.label}</button>}
        </div>)}
    </div>
  </div>
  </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
