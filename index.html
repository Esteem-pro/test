<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог и Корзина</title>
    
    <!-- Шрифты и библиотеки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        /* Базовые настройки и патч от зума */
        body { 
            font-family: 'Inter', sans-serif; 
            color: #0f172a; 
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { touch-action: manipulation; }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Блокировка скролла фона при открытой модалке (для всех экранов) */
        body.modal-open { overflow: hidden; touch-action: none; }

        /* Логика островков для мобильной корзины */
        @media (max-width: 768px) {
            .mobile-cart-sheet {
                /* В свернутом состоянии высота островка = высота его шапки (62px) */
                max-height: 62px; 
                transition: max-height 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            }
            .mobile-cart-sheet.is-open {
                /* Развернутая высота */
                max-height: 75dvh;
            }
            
            /* Плавно скрываем/показываем внутренности (товары, подвал) */
            .mobile-cart-content {
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease;
            }
            .mobile-cart-sheet.is-open .mobile-cart-content {
                opacity: 1;
                pointer-events: auto;
                transition: opacity 0.3s ease 0.15s; /* Небольшая задержка, чтобы сначала открылся островок */
            }
            
            /* Убираем линию под шапкой, если корзина свернута (для эффекта цельной капсулы) */
            .mobile-cart-sheet:not(.is-open) .cart-header-border {
                border-color: transparent;
            }
        }
    </style>
</head>
<body class="pb-28 md:pb-8 bg-[#f1f5f9] min-h-screen relative">

<!-- ЛИПКИЙ ПОИСК (ПЛАВАЮЩИЙ ОСТРОВОК) -->
<div class="sticky top-3 sm:top-5 z-40 w-full pointer-events-none mb-6 sm:mb-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 pointer-events-auto w-full">
        <div class="relative shadow-[0_8px_30px_rgb(0,0,0,0.06)] rounded-[1.2rem]">
                <!-- Поле поиска с эффектом матового стекла -->
                <input type="text" id="esSearch" 
                    class="w-full bg-white/80 backdrop-blur-xl border border-white/60 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 rounded-[1.2rem] px-5 py-3.5 pl-12 outline-none transition-all text-slate-800 placeholder-slate-400 font-medium text-base" 
                    placeholder="Поиск товаров">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row gap-6 items-start">
        
        <!-- КАТАЛОГ -->
        <div class="flex-1 w-full">
            <div id="esGrid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-5">
                <!-- Скелетоны при загрузке -->
            </div>
        </div>

        <!-- КОРЗИНА (ОСТРОВОК) -->
        <div id="esCartWidget" class="mobile-cart-sheet md:transform-none fixed md:sticky md:top-24 bottom-4 left-3 right-3 md:bottom-auto md:left-auto md:right-auto z-50 md:z-10 w-auto md:w-80 lg:w-96 bg-transparent flex flex-col mx-auto">
            
            <div class="bg-white rounded-[1.2rem] md:rounded-[1.5rem] border border-slate-200/80 shadow-[0_12px_40px_-10px_rgba(0,0,0,0.15)] md:shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] flex flex-col h-full overflow-hidden">
                
                <!-- Шапка корзины -->
                <div class="cart-header-border p-4 sm:p-5 border-b border-slate-100 flex justify-between items-center bg-slate-900 md:bg-white text-white md:text-slate-900 cursor-pointer md:cursor-default transition-colors shrink-0" onclick="toggleMobileCart()">
                    <div class="flex items-center gap-2">
                        <h2 class="font-extrabold text-lg">Ваш заказ</h2>
                        <span id="cart-count-badge" class="bg-blue-500 md:bg-slate-100 md:text-slate-600 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
                    </div>
                    <svg id="mobile-cart-arrow" class="w-6 h-6 md:hidden transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                </div>

                <!-- Контент корзины (скрывается/показывается на мобильных) -->
                <div class="mobile-cart-content flex flex-col flex-1 overflow-hidden">
                    
                    <!-- Список товаров -->
                    <div id="esCartItems" class="flex-1 overflow-y-auto p-4 bg-[#f1f5f9]/50">
                        <div class="text-center py-8 text-slate-400 font-medium text-sm">Корзина пуста</div>
                    </div>

                    <!-- Подвал корзины -->
                    <div class="p-4 sm:p-5 bg-white border-t border-slate-100 shrink-0">
                        <div class="flex justify-between items-center mb-1 text-sm font-semibold hidden"> <!-- Убрано отображение дохода -->
                            <span class="text-slate-500">Доход продавца:</span>
                            <span id="esTotalIncome" class="text-emerald-500">0 ₽</span>
                        </div>
                        <div class="flex justify-between items-end mb-4">
                            <span class="text-slate-500 font-semibold mb-1">Итого:</span>
                            <span id="esTotalSum" class="text-2xl font-extrabold text-slate-900 tracking-tight">0 ₽</span>
                        </div>
                        
                        <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold p-3 rounded-[1rem] transition-colors text-sm" onclick="clearCart(event)">
                            Очистить корзину
                        </button>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ТОВАРА -->
    <div id="esModal" class="fixed top-0 left-0 w-full h-[100dvh] bg-slate-900/40 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 sm:p-6">
        <div class="bg-white rounded-[1.5rem] shadow-2xl max-w-lg w-full flex flex-col max-h-[85dvh] overflow-hidden transform transition-all relative">
            
<div class="px-5 py-4 border-b border-slate-100 flex justify-between items-start bg-slate-50/50 shrink-0">
    <!-- Убрали класс truncate, чтобы текст мог переноситься на новые строки -->
    <h3 id="esModalTitle" class="font-extrabold text-slate-900 text-lg pr-4 leading-snug">Товар</h3>
    <!-- Кнопке крестика добавили mt-1, чтобы она визуально лучше стояла рядом с первой строкой текста -->
    <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-full transition-colors shrink-0 mt-0.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Комплектация (База)</div>
                <div id="esBasesList" class="space-y-2"></div>
                
                <div id="esAddonsContainer" class="mt-6 hidden">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Дополнительные опции</div>
                    <div id="esAddonsList" class="space-y-2"></div>
                </div>
            </div>
            
            <div class="px-5 py-4 border-t border-slate-100 bg-slate-50 flex flex-col gap-4 shrink-0">
                <div class="flex justify-between items-center">
                    <span class="font-semibold text-slate-600 text-sm">Количество:</span>
                    <div class="flex items-center gap-3 bg-white border border-slate-200 p-1 rounded-full shadow-sm">
                        <button class="w-7 h-7 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors" onclick="changeBaseQty(-1)">-</button>
                        <span id="esBaseQtyVal" class="w-6 text-center font-bold text-slate-900 text-sm">1</span>
                        <button class="w-7 h-7 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors" onclick="changeBaseQty(1)">+</button>
                    </div>
                </div>
                
                <div class="flex justify-between items-center pt-2 border-t border-slate-200/60">
                    <div id="esModalPrice" class="text-2xl font-extrabold text-slate-900">0 ₽</div>
                    <button id="esModalBtn" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-bold transition-colors" onclick="confirmAddToCart()">В корзину</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // НАСТРОЙКИ КОЛОНОК И URL
        // ============================================
        const COL_NAME = 0;   // A
        const COL_PRICE = 3;  // D
        const COL_INCOME = 7; // H
        
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQcZaUg1LNjHtFku3mI5B6_xYDitZkRM94rlESJLKVqpMeMHkwqRUelOGkbuZ365Znq296r3zixxONC/pub?gid=0&single=true&output=csv" + "&t=" + new Date().getTime();
        
        let database = [];
        let cart = [];
        let catalogMemory = {}; 
        let currentSelection = null;
        
        const fmt = (n) => new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
        
        const esc = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[match]);
        };

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { event.preventDefault(); }
            lastTouchEnd = now;
        }, false);

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        function renderSkeleton() {
            const grid = document.getElementById('esGrid');
            grid.innerHTML = "";
            for(let i=0; i<8; i++) {
                grid.innerHTML += `
                    <div class="bg-white p-4 sm:p-5 rounded-[1.5rem] border border-slate-200 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] animate-pulse flex flex-col justify-between min-h-[120px]">
                        <div class="h-4 bg-slate-200 rounded w-3/4 mb-4"></div>
                        <div class="h-4 bg-slate-200 rounded w-1/2 mb-6"></div>
                        <div class="h-5 bg-slate-200 rounded w-1/3 mt-auto"></div>
                    </div>
                `;
            }
        }

        if(typeof Papa === 'undefined') { setTimeout(initApp, 1000); } else { initApp(); }

        function initApp() {
            renderSkeleton();
            Papa.parse(SHEET_URL, {
                download: true, header: false,
                complete: function(results) { processData(results.data); },
                error: function() { document.getElementById('esGrid').innerHTML = "<div class='col-span-full text-center text-rose-500 py-10 font-medium'>Ошибка загрузки данных</div>"; }
            });
        }

        function parsePrice(str) {
            if(!str) return { val:0, isPercent:false };
            let s = str.toString().trim();
            if(s.includes('%')) {
                return { val: parseFloat(s.replace(',','.').replace(/[^0-9.]/g, '')), isPercent: true };
            }
            if(s.toLowerCase().includes('запрос')) return { val:0, isPercent:false, isRequest:true };
            let clean = s.replace(/[^0-9]/g, ''); 
            return { val: parseInt(clean) || 0, isPercent: false };
        }

        function processData(rows) {
            database = [];
            let currentGroup = null;
            let isAddons = false;

            rows.forEach((row) => {
                if(!row[COL_NAME]) return; 
                let name = row[COL_NAME].trim();
                if(name === "") return;

                let priceRaw = row[COL_PRICE];
                let isHeader = (!priceRaw || priceRaw.trim() === "") 
                               && !name.toLowerCase().includes("позиция")
                               && !name.toLowerCase().includes("себестоимость");

                if(name.toLowerCase().includes("доп. элементы")) {
                    isAddons = true; return; 
                }

                if(isHeader) {
                    currentGroup = { title: name, items: [], addons: [] };
                    database.push(currentGroup);
                    isAddons = false;
                } else if(currentGroup && !name.toLowerCase().includes("позиция")) {
                    let p = parsePrice(row[COL_PRICE]);
                    let inc = parsePrice(row[COL_INCOME]);
                    let item = { name, price: p.val, isPercent: p.isPercent, isRequest: p.isRequest, income: inc.val };
                    
                    if(isAddons) currentGroup.addons.push(item);
                    else currentGroup.items.push(item);
                }
            });

            database = database.filter(g => g.items.length > 0 || g.addons.length > 0);
            renderCatalog();
        }

        function renderCatalog(filter = "") {
            const grid = document.getElementById('esGrid');
            grid.innerHTML = "";
            let lower = filter.toLowerCase();

            database.forEach((group, idx) => {
                let match = group.title.toLowerCase().includes(lower) || group.items.some(i => i.name.toLowerCase().includes(lower));
                if(!match) return;

                let prices = group.items.map(i => i.isPercent ? 0 : i.price);
                let minP = Math.min(...prices);
                let priceText = minP > 0 ? `от ${fmt(minP)}` : (group.items.some(i=>i.isPercent) ? "Расчет %" : "По запросу");

                let card = document.createElement('div');
                card.className = 'bg-white p-4 sm:p-5 rounded-[1.5rem] border border-slate-200 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] hover:border-blue-400 hover:shadow-[0_8px_25px_-5px_rgba(0,0,0,0.06)] hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between min-h-[120px] relative group';
                card.onclick = () => openModalFromCatalog(idx);
                card.innerHTML = `
                    <div class="font-bold text-slate-800 text-sm sm:text-base leading-snug mb-3 group-hover:text-blue-700 transition-colors">${esc(group.title)}</div>
                    <div class="mt-auto font-extrabold text-blue-600 text-base">${priceText}</div>
                `;
                grid.appendChild(card);
            });
            
            if(grid.innerHTML === "") {
                grid.innerHTML = "<div class='col-span-full text-center text-slate-500 py-10 font-medium'>Ничего не найдено</div>";
            }
        }

        // ============================================
        // ЛОГИКА МОДАЛЬНОГО ОКНА
        // ============================================
        function openModalFromCatalog(idx) {
            let saved = catalogMemory[idx];
            if (saved) {
                currentSelection = JSON.parse(JSON.stringify(saved));
                currentSelection.mode = 'new';
                currentSelection.cartIdx = -1;
            } else {
                currentSelection = { groupIdx: idx, baseIdx: 0, baseQty: 1, addons: {}, mode: 'new', cartIdx: -1 };
            }
            renderModalContent();
        }

        function openModalFromCart(cartIndex) {
            let item = cart[cartIndex];
            let groupIdx = database.findIndex(g => g.title === item.title);
            let group = database[groupIdx];
            let addonsMap = {};
            item.addons.forEach(savedAddon => {
                let foundIdx = group.addons.findIndex(a => a.name === savedAddon.name);
                if(foundIdx !== -1) addonsMap[foundIdx] = savedAddon.qty;
            });
            let baseIdx = group.items.findIndex(b => b.name === item.base.name);
            if(baseIdx === -1) baseIdx = 0;

            currentSelection = { groupIdx: groupIdx, baseIdx: baseIdx, baseQty: item.baseQty, addons: addonsMap, mode: 'edit', cartIdx: cartIndex };
            renderModalContent();
        }

        function renderModalContent() {
            let group = database[currentSelection.groupIdx];
            
            document.getElementById('esModalTitle').innerText = (currentSelection.mode === 'edit' ? "Редактирование" : esc(group.title));
            const btn = document.getElementById('esModalBtn');
            if(currentSelection.mode === 'edit') {
                btn.innerText = "Сохранить";
                btn.className = "bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold transition-colors";
            } else {
                btn.innerText = "Добавить";
                btn.className = "bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-bold transition-colors";
            }

            const bList = document.getElementById('esBasesList');
            bList.innerHTML = "";
            let bases = group.items.length ? group.items : [{name: "База", price:0}];
            
            bases.forEach((item, i) => {
                let pText = item.isPercent ? `${item.price}%` : (item.price===0?"По запросу":fmt(item.price));
                let isActive = (i === currentSelection.baseIdx);
                
                let activeClasses = isActive 
                    ? "border-blue-600 bg-blue-50 ring-1 ring-blue-600 shadow-sm" 
                    : "border-slate-200 bg-white hover:border-blue-300";
                    
                let radioStyle = isActive 
                    ? "border-[5px] border-blue-600 bg-white" 
                    : "border-2 border-slate-300 bg-white";

                bList.innerHTML += `
                    <div class="flex justify-between items-center p-3 rounded-xl border ${activeClasses} cursor-pointer transition-all" onclick="selectBase(${i})">
                        <div class="flex items-center gap-3">
                            <div class="w-5 h-5 rounded-full flex-shrink-0 ${radioStyle} shadow-sm transition-all"></div>
                            <span class="font-semibold text-sm ${isActive ? 'text-blue-900' : 'text-slate-700'}">${esc(item.name)}</span>
                        </div>
                        <span class="font-extrabold text-sm whitespace-nowrap ml-3 ${isActive ? 'text-blue-600' : 'text-slate-900'}">${pText}</span>
                    </div>`;
            });

            const aList = document.getElementById('esAddonsList');
            const aCont = document.getElementById('esAddonsContainer');
            aList.innerHTML = "";
            
            if(group.addons.length === 0) {
                aCont.classList.add('hidden');
            } else {
                aCont.classList.remove('hidden');
                group.addons.forEach((item, i) => {
                    let pText = item.isPercent ? `${item.price}%` : fmt(item.price);
                    let qty = currentSelection.addons[i] || 0;
                    let isActive = qty > 0;
                    
                    let activeClasses = isActive ? "border-blue-400 bg-blue-50/70 shadow-sm" : "border-slate-200 bg-white hover:border-blue-300";

                    aList.innerHTML += `
                        <div class="flex justify-between items-center p-3 rounded-xl border ${activeClasses} transition-colors">
                            <div class="flex flex-col">
                                <span class="font-semibold text-sm text-slate-700 leading-tight">${esc(item.name)}</span>
                                <span class="font-bold text-xs text-slate-500 mt-0.5">${pText}</span>
                            </div>
                            <div class="flex items-center gap-2 bg-white border border-slate-200 p-1 rounded-full shadow-sm ml-3 shrink-0">
                                <button class="w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors text-xs" onclick="changeAddonQty(${i}, -1)">-</button>
                                <span id="esAddonQty_${i}" class="w-4 text-center font-bold text-sm ${isActive ? 'text-slate-900' : 'text-slate-400'}">${qty}</span>
                                <button class="w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors text-xs" onclick="changeAddonQty(${i}, 1)">+</button>
                            </div>
                        </div>`;
                });
            }
            
            document.getElementById('esBaseQtyVal').innerText = currentSelection.baseQty;
            
            const modal = document.getElementById('esModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('modal-open');
            updateCalc();
        }

        function closeModal() { 
            const modal = document.getElementById('esModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.classList.remove('modal-open'); 
        }

        window.selectBase = function(i) {
            currentSelection.baseIdx = i;
            renderModalContent(); 
        }

        window.changeBaseQty = function(delta) {
            let newQty = currentSelection.baseQty + delta;
            if(newQty < 1) newQty = 1;
            currentSelection.baseQty = newQty;
            document.getElementById('esBaseQtyVal').innerText = newQty;
            updateCalc();
        }

        window.changeAddonQty = function(idx, delta) {
            let currentQty = currentSelection.addons[idx] || 0;
            let newQty = currentQty + delta;
            if(newQty < 0) newQty = 0;
            
            if(newQty === 0) delete currentSelection.addons[idx];
            else currentSelection.addons[idx] = newQty;
            
            let span = document.getElementById(`esAddonQty_${idx}`);
            span.innerText = newQty;
            if(newQty > 0) {
                span.classList.remove('text-slate-400'); 
                span.classList.add('text-slate-900');
                span.parentElement.parentElement.classList.add('border-blue-400', 'bg-blue-50/70', 'shadow-sm');
                span.parentElement.parentElement.classList.remove('border-slate-200', 'bg-white');
            } else {
                span.classList.add('text-slate-400'); 
                span.classList.remove('text-slate-900');
                span.parentElement.parentElement.classList.remove('border-blue-400', 'bg-blue-50/70', 'shadow-sm');
                span.parentElement.parentElement.classList.add('border-slate-200', 'bg-white');
            }
            updateCalc();
        }

        function updateCalc() {
            let group = database[currentSelection.groupIdx];
            let base = group.items.length ? group.items[currentSelection.baseIdx] : {price:0};
            let total = 0;
            let percentStr = "";

            if(base.isPercent) percentStr = ` + ${base.price}%`;
            else total += base.price * currentSelection.baseQty;
            
            for (const [idx, qty] of Object.entries(currentSelection.addons)) {
                let add = group.addons[idx];
                if(add.isPercent) percentStr += ` + ${add.price}%`;
                else total += add.price * qty;
            }
            document.getElementById('esModalPrice').innerText = fmt(total) + percentStr;
        }

        // ============================================
        // ЛОГИКА КОРЗИНЫ
        // ============================================
        function confirmAddToCart() {
            let group = database[currentSelection.groupIdx];
            let baseItem = group.items.length ? group.items[currentSelection.baseIdx] : {name:"Товар", price:0, income:0};
            let selectedAddons = [];
            for (const [idx, qty] of Object.entries(currentSelection.addons)) {
                selectedAddons.push({ ...group.addons[idx], qty: qty });
            }
            
            catalogMemory[currentSelection.groupIdx] = {
                groupIdx: currentSelection.groupIdx, baseIdx: currentSelection.baseIdx,
                baseQty: currentSelection.baseQty, addons: {...currentSelection.addons}
            };

            let newItem = {
                title: group.title, base: baseItem, baseQty: currentSelection.baseQty, addons: selectedAddons
            };

            if(currentSelection.mode === 'edit') cart[currentSelection.cartIdx] = newItem;
            else cart.push(newItem);
            
            closeModal();
            renderCart();
            
            // Автоматическое показ корзины при добавлении первого товара (на мобилках)
            if(window.innerWidth <= 768 && cart.length === 1) {
                const widget = document.getElementById('esCartWidget');
                const arrow = document.getElementById('mobile-cart-arrow');
                
                widget.classList.add('is-open');
                arrow.style.transform = 'rotate(180deg)';
                
                // Автоматически прячем через 2.5 секунды
                setTimeout(() => {
                    widget.classList.remove('is-open');
                    arrow.style.transform = 'rotate(0deg)';
                }, 2500);
            }
        }

        function renderCart() {
            let fixedSum = 0, fixedInc = 0;
            cart.forEach(c => {
                if(!c.base.isPercent) {
                    fixedSum += c.base.price * c.baseQty;
                    fixedInc += c.base.income * c.baseQty;
                }
                c.addons.forEach(a => {
                    if(!a.isPercent) {
                        fixedSum += a.price * a.qty;
                        fixedInc += a.income * a.qty;
                    }
                });
            });

            let total = fixedSum, totalInc = fixedInc;
            const list = document.getElementById('esCartItems');
            list.innerHTML = "";

            cart.forEach((c, idx) => {
                let itemTotalCost = 0; 
                let basePriceText = "";

                if(c.base.isPercent) {
                    let oneItemVal = fixedSum * (c.base.price / 100);
                    let allItemsVal = oneItemVal * c.baseQty;
                    total += allItemsVal;
                    totalInc += (fixedSum * (c.base.income / 100)) * c.baseQty;
                    itemTotalCost = allItemsVal;
                    basePriceText = `${c.base.price}% (${fmt(oneItemVal)} x ${c.baseQty})`;
                } else {
                    itemTotalCost = c.base.price * c.baseQty;
                    basePriceText = `${fmt(c.base.price)} x ${c.baseQty}`;
                }

                let addonsHtml = "";
                c.addons.forEach(a => {
                    let aText = "", aCost = 0;
                    if(a.isPercent) {
                        let oneVal = fixedSum * (a.price / 100);
                        let allVal = oneVal * a.qty;
                        total += allVal;
                        totalInc += (fixedSum * (a.income / 100)) * a.qty;
                        aCost = allVal;
                        aText = `${a.price}% (${fmt(oneVal)}) x ${a.qty}`;
                    } else {
                        aCost = a.price * a.qty;
                        aText = `${fmt(a.price)} x ${a.qty}`;
                    }
                    itemTotalCost += aCost;
                    addonsHtml += `<div class="text-xs text-slate-500 mb-0.5"><span class="text-slate-400">+</span> ${esc(a.name)}: ${aText}</div>`;
                });

                let row = document.createElement('div');
                row.className = 'bg-white p-4 rounded-[1rem] border border-slate-100 shadow-[0_2px_10px_-2px_rgba(0,0,0,0.03)] mb-3 relative cursor-pointer hover:border-blue-300 transition-colors group';
                row.onclick = () => openModalFromCart(idx);
                
                row.innerHTML = `
                    <button class="absolute top-2 right-2 text-slate-300 hover:text-rose-500 transition-colors p-2 rounded-lg opacity-100 md:opacity-0 group-hover:opacity-100 focus:opacity-100" onclick="removeFromCart(event, ${idx})">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    <div class="font-bold text-slate-800 text-sm pr-6 mb-1 leading-tight">${esc(c.title)}</div>
                    <div class="text-xs font-semibold text-slate-500 mb-1">${esc(c.base.name)} — ${basePriceText}</div>
                    ${addonsHtml ? `<div class="mt-2 mb-2 pl-2 border-l-2 border-slate-100">${addonsHtml}</div>` : ''}
                    <div class="mt-3 flex justify-between items-center pt-3 border-t border-slate-100 border-dashed">
                        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Сумма</span>
                        <span class="font-extrabold text-sm text-slate-900">${fmt(itemTotalCost)}</span>
                    </div>
                `;
                list.appendChild(row);
            });
            
            if(cart.length===0) list.innerHTML = "<div class='text-center py-8 text-slate-400 font-medium text-sm'>Корзина пуста</div>";

            document.getElementById('esTotalSum').innerText = fmt(total);
            document.getElementById('esTotalIncome').innerText = fmt(totalInc);
            
            const badge = document.getElementById('cart-count-badge');
            if(cart.length > 0) {
                badge.innerText = cart.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        window.removeFromCart = function(e, i) { 
            e.stopPropagation(); 
            let item = cart[i];
            let groupIdx = database.findIndex(g => g.title === item.title);
            if (groupIdx !== -1) delete catalogMemory[groupIdx];
            cart.splice(i, 1); 
            renderCart(); 
        }

        window.clearCart = function(e) { 
            if(e) e.stopPropagation(); 
            cart = []; 
            catalogMemory = {}; 
            renderCart(); 
            if(window.innerWidth <= 768) {
                document.getElementById('esCartWidget').classList.remove('is-open');
                document.getElementById('mobile-cart-arrow').style.transform = 'rotate(0deg)';
            }
        }

        window.toggleMobileCart = function() {
            if(window.innerWidth <= 768) {
                const widget = document.getElementById('esCartWidget');
                const arrow = document.getElementById('mobile-cart-arrow');
                widget.classList.toggle('is-open');
                arrow.style.transform = widget.classList.contains('is-open') ? 'rotate(180deg)' : 'rotate(0deg)';
            }
        }

        document.getElementById('esSearch').addEventListener('input', (e) => renderCatalog(e.target.value));
    </script>
</body>
</html>
