<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ПОТОК — таск-трекер маркетинг-команды</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%23FF5A2D"/><text x="50" y="72" font-size="58" text-anchor="middle" fill="white" font-family="Arial" font-weight="900">П</text></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#141B17; --paper:#F1F3ED; --line:#E1E5DA; --line2:#EDF0E6; --mut:#6C7A70;
  --card:#FFFFFF; --soft:#F1F3ED; --soft2:#F6F8F2; --field:#FAFBF7; --colbg:#E9ECE2;
  --track:#EEF0E7;
  --accent:#FF5A2D; --accent-d:#E64A20;
  --side:#0F1713; --side-t:#DCE7DE; --side-m:#83988B;
  --blue:#2E6BFF; --green:#0FA36B; --amber:#E8930C; --red:#E5484D;
  --griddot:rgba(20,27,23,.08); --ring:rgba(20,27,23,.09);
  --dash:color-mix(in srgb, var(--ink) 22%, transparent);
  --sh-sm:0 1px 2px rgba(20,27,23,.06),0 1px 1px rgba(20,27,23,.04);
  --sh-md:0 12px 26px -10px rgba(20,27,23,.22);
  --r:14px;
}
.dark{
  --ink:#E9EFE7; --paper:#0F1512; --line:#28332B; --line2:#1E2821; --mut:#8CA093;
  --card:#171F1A; --soft:#212B24; --soft2:#1C2620; --field:#131A15; --colbg:#141C17;
  --track:#263129;
  --griddot:rgba(233,239,231,.05); --ring:rgba(233,239,231,.13);
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh-md:0 14px 30px -12px rgba(0,0,0,.6);
}
html,body{height:100%}
body{
  font:400 14px/1.5 'Golos Text',system-ui,sans-serif;color:var(--ink);
  background:var(--paper);
  background-image:radial-gradient(var(--griddot) 1px,transparent 1.3px);
  background-size:22px 22px;
  transition:background-color .3s,color .3s;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(720px 440px at 90% -10%, rgba(255,90,45,.10), transparent 60%),
    radial-gradient(680px 440px at -8% 112%, rgba(46,107,255,.09), transparent 60%);
}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:#CBD2C3;border-radius:99px;border:2px solid var(--paper)}
.dark ::-webkit-scrollbar-thumb{background:#33413A;border-color:var(--paper)}
button{font-family:inherit}

.app{display:flex;min-height:100vh;position:relative;z-index:1}
.main{flex:1;min-width:0;padding:26px 30px 44px}

/* sidebar */
.side{width:262px;flex:0 0 262px;background:var(--side);color:var(--side-t);
  padding:22px 14px 18px;display:flex;flex-direction:column;gap:14px;
  position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px}
.logo{width:44px;height:44px;background:var(--accent);border-radius:13px;display:grid;place-items:center;
  font:900 21px 'Unbounded';color:#fff;transform:rotate(-4deg);
  box-shadow:0 8px 16px -6px rgba(255,90,45,.6);transition:transform .25s}
.brand:hover .logo{transform:rotate(4deg) scale(1.05)}
.brand b{font:700 17px 'Unbounded';letter-spacing:.06em;display:block;color:#fff}
.brand span{font-size:10px;color:var(--side-m);text-transform:uppercase;letter-spacing:.18em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 11px;border:0;background:transparent;
  color:var(--side-m);font:500 13px 'Golos Text';border-radius:9px;cursor:pointer;text-align:left;transition:.18s}
.nav button:hover{background:rgba(255,255,255,.07);color:var(--side-t);transform:translateX(2px)}
.nav button.on{background:rgba(255,90,45,.16);color:#fff}
.nav .grp{font:600 9.5px 'Golos Text';text-transform:uppercase;letter-spacing:.18em;color:var(--side-m);
  padding:8px 11px 3px;opacity:.8}
.pulse{width:7px;height:7px;border-radius:50%;background:#3DDC84;margin-left:auto;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(61,220,132,.55);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.sb h5{font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.18em;color:var(--side-m);
  margin:0 8px 8px;display:flex;align-items:center}
.tmode{margin-left:auto;border:0;background:rgba(255,255,255,.1);color:var(--side-t);font:700 9px 'Golos Text';
  padding:2px 8px;border-radius:99px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:.15s}
.tmode:hover{background:var(--accent)}
.sb{display:flex;flex-direction:column;gap:1px}
.srow{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;transition:.15s;color:var(--side-t);font-size:12.5px;background:transparent;
  width:100%;text-align:left;font-family:inherit}
.srow:hover{background:rgba(255,255,255,.06)}
.srow.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.thash{color:var(--side-m);font-weight:700;font-size:12px}
.cnt{margin-left:auto;font:600 10.5px 'Golos Text';background:rgba(255,255,255,.09);
  padding:2px 8px;border-radius:99px;color:var(--side-t)}
.sprint{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);
  border-radius:13px;padding:13px 14px}
.sprint .live{display:flex;align-items:center;gap:8px;font:600 10.5px 'Golos Text';color:#8FE3B0;
  text-transform:uppercase;letter-spacing:.14em}
.sprint b{font:600 13px 'Unbounded';display:block;margin:8px 0 4px;color:#fff}
.sprint small{color:var(--side-m);font-size:11.5px;line-height:1.5;display:block}
.sprint-goal{margin-top:10px;padding:8px 10px;background:rgba(255,255,255,.04);border-radius:8px;
  font:500 11px 'Golos Text';color:var(--side-t);line-height:1.4}
.reset{margin-top:10px;border:0;background:transparent;color:var(--side-m);font:500 11px 'Golos Text';
  cursor:pointer;padding:7px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;transition:.15s;width:100%}
.reset:hover{color:#fff;background:rgba(255,255,255,.07)}
.hotkeys{margin-top:8px;font:500 10px 'Golos Text';color:var(--side-m);padding:0 8px;line-height:2.1}
.hotkeys b{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px;font-weight:600;margin-right:2px;color:var(--side-t)}

/* quick notes (scratchpad) */
.scratch{margin-top:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  border-radius:11px;padding:10px 12px}
.scratch h5{margin:0 0 6px;display:flex;align-items:center;gap:6px}
.scratch textarea{width:100%;min-height:72px;resize:vertical;border:0;background:transparent;
  font:500 11.5px 'Golos Text';color:var(--side-t);outline:none;line-height:1.45}
.scratch textarea::placeholder{color:var(--side-m)}

/* topbar */
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.kicker{display:inline-flex;gap:9px;align-items:center;font:600 11px 'Golos Text';
  letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.kicker i{width:20px;height:3px;background:var(--accent);border-radius:2px}
h1{font:900 clamp(24px,2.8vw,36px)/1.1 'Unbounded';margin-top:9px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;height:42px;width:240px;transition:.2s;box-shadow:var(--sh-sm);color:var(--mut)}
.search:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
.search input{border:0;outline:0;background:none;font:500 13.5px 'Golos Text';width:100%;color:var(--ink)}
.search .x{border:0;background:none;cursor:pointer;color:var(--mut);display:grid;place-items:center;padding:3px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;
  height:42px;align-items:center;box-shadow:var(--sh-sm);flex-wrap:wrap}
.seg button{border:0;background:transparent;font:600 12px 'Golos Text';color:var(--mut);
  padding:7px 11px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:700 13.5px 'Golos Text';
  border-radius:11px;padding:0 18px;height:42px;transition:.18s;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 10px 20px -9px rgba(255,90,45,.75)}
.btn.pri:hover{background:var(--accent-d);transform:translateY(-2px)}
.btn.pri:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:color-mix(in srgb,#E5484D 13%,transparent);color:var(--red);height:38px;padding:0 14px}
.btn.danger:hover{background:color-mix(in srgb,#E5484D 20%,transparent)}
.btn.sm{height:34px;padding:0 13px;font-size:12px;border-radius:9px}
.btn.xs{height:26px;padding:0 10px;font-size:10.5px;border-radius:7px}
.vtool{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:16px;color:var(--mut);font-size:12.5px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--mut);display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--sh-sm);transition:.18s}
.iconbtn:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-1px)}
.iconbtn.has{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
.livechip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:11px;
  border:1px solid color-mix(in srgb,var(--red) 40%,transparent);
  background:color-mix(in srgb,var(--red) 9%,transparent);color:var(--red);font:700 12px 'Golos Text';
  cursor:pointer;transition:.15s;max-width:320px}
.livechip:hover{transform:translateY(-1px)}
.livechip .lct{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.livechip b{font-variant-numeric:tabular-nums}
.pomobadge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;
  background:color-mix(in srgb,var(--amber) 18%,transparent);color:#D97706;font:700 10px 'Golos Text';
  text-transform:uppercase;letter-spacing:.08em;margin-left:6px}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 auto;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.bbadge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font:700 9.5px 'Golos Text';
  padding:2px 6px;border-radius:99px;box-shadow:0 3px 8px -2px rgba(255,90,45,.8);animation:bpop .3s}
@keyframes bpop{from{transform:scale(.4);opacity:0}}
.bellwrap{position:relative}
.bback{position:fixed;inset:0;z-index:44;background:transparent}
.bpanel{position:absolute;right:0;top:calc(100% + 10px);width:336px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-md);z-index:45;overflow:hidden;animation:mpop .22s}
.bp-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;
  border-bottom:1px solid var(--line2);font:600 13px 'Golos Text'}
.bp-head span{font:700 11px;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);
  padding:2px 9px;border-radius:99px}
.bp-sec{padding:10px 16px 4px;font:600 10px 'Golos Text';letter-spacing:.15em;text-transform:uppercase;color:var(--mut)}
.bp-row{display:flex;gap:9px;align-items:center;width:100%;padding:9px 16px;border:0;background:none;
  cursor:pointer;text-align:left;font-family:inherit;transition:.15s}
.bp-row:hover{background:var(--soft2)}
.bp-row .t{flex:1;font:600 12.5px 'Golos Text';color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-row .d{font:600 10.5px 'Golos Text';color:var(--mut);white-space:nowrap}
.bp-empty{padding:24px 16px;text-align:center;color:var(--mut);font-size:12.5px}
.bp-all{width:100%;border:0;background:var(--soft);padding:12px;font:600 12px 'Golos Text';color:var(--ink);
  cursor:pointer;border-top:1px solid var(--line2);transition:.15s}
.bp-all:hover{background:var(--soft2);color:var(--accent)}

/* active filter chips */
.fbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.achip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:6px 7px 6px 12px;font:600 11.5px 'Golos Text';box-shadow:var(--sh-sm);animation:bpop .25s;max-width:280px}
.achip .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.achip button{border:0;background:var(--soft);border-radius:50%;width:18px;height:18px;display:grid;
  place-items:center;cursor:pointer;color:var(--mut);transition:.12s;flex:0 0 auto}
.achip button:hover{background:color-mix(in srgb,#E5484D 16%,transparent);color:var(--red)}
.achip.clear{background:transparent;border-style:dashed;color:var(--mut);cursor:pointer;padding:6px 13px}
.achip.clear:hover{color:var(--red);border-color:var(--red)}
.fbar-note{font:600 10.5px 'Golos Text';color:var(--mut);text-transform:uppercase;letter-spacing:.08em}

/* ctrl row */
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.vseg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;box-shadow:var(--sh-sm)}
.vseg button{border:0;background:none;font:600 12px 'Golos Text';padding:8px 13px;border-radius:8px;
  cursor:pointer;color:var(--mut);display:flex;gap:7px;align-items:center;transition:.15s;white-space:nowrap}
.vseg button:hover{color:var(--ink)}
.vseg button.on{background:var(--ink);color:var(--paper)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:600 11.5px 'Golos Text';
  padding:7px 12px;border-radius:99px;cursor:pointer;transition:.15s;display:inline-flex;gap:6px;align-items:center}
.fchip:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-1px)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fchip b{font:700 10px 'Golos Text';background:var(--ring);padding:1px 7px;border-radius:99px;color:inherit}
.sortsel{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;
  font:600 12px 'Golos Text';color:var(--ink);cursor:pointer;box-shadow:var(--sh-sm);outline:none}
.sortsel:focus{border-color:var(--ink)}

/* stats */
.stats{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);margin-bottom:20px;overflow:hidden;flex-wrap:wrap;animation:rise .45s both}
.stat{flex:1;padding:15px 20px;border-right:1px solid var(--line);min-width:150px}
.stat .lbl{font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.15em;color:var(--mut)}
.stat .num{font:700 28px/1.2 'Unbounded';margin-top:3px}
.stat .sub{font-size:11.5px;color:var(--mut);margin-top:1px}
.ringbox{display:flex;align-items:center;gap:14px;padding:12px 22px}
.ringbox b{font:600 12.5px 'Unbounded'}
.ringbox small{color:var(--mut);font-size:11px;display:block;margin-top:2px}

/* board */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:14px}
.col{flex:1 1 0;min-width:230px;background:var(--colbg);border:1px solid var(--line);border-top:3px solid;
  border-radius:var(--r);display:flex;flex-direction:column;transition:background .2s;animation:rise .45s both}
.col.over{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--soft2)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes fade{from{opacity:0}}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 12px 10px}
.col-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.col-head h3{font:600 11px 'Unbounded';letter-spacing:.04em;text-transform:uppercase}
.col-head .n{font:700 11px 'Golos Text';background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:2px 9px;color:var(--mut)}
.col-add{margin-left:auto;border:0;background:transparent;width:26px;height:26px;border-radius:8px;
  cursor:pointer;color:var(--mut);display:grid;place-items:center;transition:.15s}
.col-add:hover{background:var(--card);color:var(--accent);transform:scale(1.1)}
.col-body{display:flex;flex-direction:column;gap:10px;padding:2px 10px 12px;min-height:120px}
.empty{border:1.5px dashed var(--dash);border-radius:11px;padding:24px 10px;text-align:center;color:var(--mut);font-size:12px}

/* pinned section */
.pinned{margin-bottom:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--amber) 8%,transparent),transparent);
  border:1px solid color-mix(in srgb,var(--amber) 25%,var(--line));border-radius:var(--r);padding:14px 16px;
  animation:rise .4s both}
.pinned h3{font:600 11px 'Unbounded';letter-spacing:.08em;text-transform:uppercase;color:var(--amber);
  display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pinned-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab;
  box-shadow:var(--sh-sm);transition:transform .18s,box-shadow .18s,opacity .18s,border-color .18s;
  animation:pop .4s both;user-select:none;position:relative;
  display:flex;flex-direction:column;gap:8px;overflow:hidden;max-width:100%}
.card.pinned{border-color:color-mix(in srgb,var(--amber) 40%,var(--line));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--amber) 25%,transparent),var(--sh-sm)}
.card.fav{border-color:color-mix(in srgb,#E8930C 40%,var(--line))}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.card.drag{opacity:.4;transform:rotate(2deg) scale(.98);cursor:grabbing}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.card-actions{display:flex;gap:2px;margin-left:auto;flex:0 0 auto;opacity:0;transition:.15s}
.card:hover .card-actions,.card.selected .card-actions{opacity:1}
.card-actions button{width:24px;height:24px;border:0;background:transparent;color:var(--mut);
  border-radius:6px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.card-actions button:hover{background:var(--soft);color:var(--ink)}
.card-actions button.on{color:var(--amber)}
.card-actions button.pinned-on{color:var(--amber)}
.card-actions button.fav-on{color:#E8930C}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 10.5px 'Golos Text';letter-spacing:.05em;
  text-transform:uppercase;padding:3.5px 9px;border-radius:99px;white-space:nowrap;
  border:0;cursor:pointer;transition:.15s;font-family:inherit;max-width:100%;overflow:hidden}
.chip .dot{width:7px;height:7px;flex:0 0 auto}
.chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{filter:brightness(1.1)}
.bchip{font:700 9px 'Golos Text';letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;
  white-space:nowrap;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.pr{font:600 10.5px 'Golos Text';display:inline-flex;gap:5px;align-items:center;white-space:nowrap;
  border:0;background:transparent;cursor:pointer;padding:3px 7px;border-radius:99px;transition:.15s;
  font-family:inherit}
.pr:hover{background:var(--soft)}
.pr small{color:var(--mut)}
.card h4{font:600 14px/1.35 'Golos Text';margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;min-width:0}
.donecheck{color:var(--green);font-weight:700}
.card .desc{font-size:12px;color:var(--mut);line-height:1.45;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;min-width:0}
.ctypes{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.ttype{font:600 10px 'Golos Text';color:#fff;padding:2.5px 9px;border-radius:99px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  border:0;cursor:pointer;transition:.15s;font-family:inherit}
.ttype:hover{filter:brightness(1.15)}
.subbar{display:flex;align-items:center;gap:8px;min-width:0}
.track{flex:1;height:4px;background:var(--track);border-radius:99px;overflow:hidden;min-width:0}
.track i{display:block;height:100%;border-radius:99px}
.subn{font:600 10.5px 'Golos Text';color:var(--mut);flex:0 0 auto;white-space:nowrap}
.foot{display:flex;align-items:center;gap:7px;margin-top:2px;min-width:0;flex-wrap:wrap}
.ava{border-radius:50%;display:inline-grid;place-items:center;font:700 9px 'Golos Text';color:#fff;
  flex:0 0 auto;border:2px solid rgba(255,255,255,.25);box-shadow:var(--sh-sm);
  cursor:pointer;transition:.15s}
.ava:hover{transform:scale(1.1)}
.who{font-size:11.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.com{display:inline-flex;gap:4px;align-items:center;font:600 11px 'Golos Text';color:var(--mut);
  border:0;background:transparent;cursor:pointer;padding:3px 7px;border-radius:99px;transition:.15s;font-family:inherit}
.com:hover{background:var(--soft);color:var(--ink)}
.tchip{display:inline-flex;align-items:center;gap:5px;font:600 10.5px 'Golos Text';font-variant-numeric:tabular-nums;
  border:1px solid var(--line);background:var(--soft);color:var(--mut);padding:3px 8px;border-radius:99px;
  cursor:pointer;transition:.15s;white-space:nowrap;flex:0 0 auto;font-family:inherit}
.tchip:hover{border-color:var(--ink);color:var(--ink)}
.tchip.run{background:color-mix(in srgb,#E5484D 12%,transparent);color:var(--red);
  border-color:color-mix(in srgb,#E5484D 35%,transparent)}
.due{font:600 11px 'Golos Text';padding:3px 9px;border-radius:99px;
  background:var(--soft);color:var(--mut);white-space:nowrap;display:inline-block;flex:0 0 auto;
  border:0;cursor:pointer;font-family:inherit;transition:.15s}
.due:hover{background:var(--line)}
.due.warn{background:color-mix(in srgb,#E8930C 16%,transparent);color:#D97706}
.due.bad{background:color-mix(in srgb,#E5484D 15%,transparent);color:var(--red);animation:alarm 1.6s infinite}
@keyframes alarm{50%{background:color-mix(in srgb,#E5484D 26%,transparent)}}

/* repeat chip in task row */
.rchip{display:inline-flex;align-items:center;gap:4px;font:600 10px 'Golos Text';color:#0EA5C6;
  background:color-mix(in srgb,#0EA5C6 12%,transparent);padding:3px 8px;border-radius:99px;white-space:nowrap}

/* quick dropdown on card */
.qdd{position:absolute;z-index:30;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--sh-md);padding:4px;min-width:180px;max-width:240px;
  animation:mpop .15s}
.qdd button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;background:transparent;
  color:var(--ink);font:500 12px 'Golos Text';border-radius:6px;cursor:pointer;text-align:left;transition:.12s;
  font-family:inherit;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qdd button:hover{background:var(--soft2)}
.qdd button.on{background:var(--soft);font-weight:600}
.qdd .sep{height:1px;background:var(--line2);margin:4px 0}

/* list view */
.ltab{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);
  overflow-x:auto;animation:rise .4s both}
.lrow{display:grid;grid-template-columns:minmax(250px,2.4fr) 112px 132px 112px 158px 168px;gap:10px;
  align-items:center;padding:11px 16px;border-bottom:1px solid var(--line2);cursor:pointer;
  transition:background .15s;min-width:980px;animation:fade .35s both}
.lrow:hover{background:var(--soft2)}
.lrow:last-child{border-bottom:0}
.lrow.lhead{font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.12em;color:var(--mut);
  cursor:default;background:var(--field)}
.lrow.lhead:hover{background:var(--field)}
.lrow.done .lt{color:var(--mut);text-decoration:line-through}
.lmain{display:flex;gap:10px;align-items:flex-start;min-width:0}
.lmain .pr{margin-top:3px}
.lt{font:600 13.5px/1.3 'Golos Text';display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld{font-size:11px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.lwho{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);min-width:0;overflow:hidden}
.lprog{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.lcol-sel{position:relative;display:inline-block}
.lcol-sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:9px;
  padding:6px 26px 6px 24px;font:600 11.5px 'Golos Text';cursor:pointer;background:var(--card);color:var(--ink);outline:none;transition:.15s}
.lcol-sel select:hover{border-color:var(--ink)}
.lcol-sel .dot{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.lcol-sel::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-size:9px;color:var(--mut);pointer-events:none}

/* my tasks */
.mhead{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);padding:18px 22px;margin-bottom:14px;flex-wrap:wrap;animation:rise .4s both}
.mhead .ava{box-shadow:0 8px 18px -8px rgba(0,0,0,.4)}
.mhead h3{font:700 16px 'Unbounded'}
.mhead small{color:var(--mut);font-size:12px;display:block;margin-top:3px}
.mstats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.mstat{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:96px}
.mstat b{font:700 20px 'Unbounded';display:block}
.mstat span{font:600 10px 'Golos Text';text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
.mgroup{margin-bottom:18px;animation:rise .45s both}
.mgt{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mgt h4{font:600 11.5px 'Unbounded';letter-spacing:.06em;text-transform:uppercase}
.mgt .n{font:700 11px 'Golos Text';background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--mut)}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);
  overflow:hidden;overflow-x:auto;animation:rise .4s both}
.cal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-head h3{font:700 17px 'Unbounded'}
.cal-nav{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;
  display:grid;place-items:center;color:var(--mut);transition:.15s}
.cal-nav:hover{border-color:var(--ink);color:var(--ink);transform:scale(1.06)}
.cal-cnt{font:600 11.5px 'Golos Text';color:var(--mut);background:var(--soft);padding:5px 11px;border-radius:99px}
.legend{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px;font:500 11px 'Golos Text';color:var(--mut)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);min-width:680px}
.cal-dow{padding:9px;text-align:center;font:600 10.5px 'Golos Text';letter-spacing:.12em;
  text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
.cal-dow.we{color:#C58A6B}
.cal-cell{min-height:106px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:6px;cursor:pointer;transition:background .15s}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:var(--soft2)}
.cal-cell.wk{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.cal-cell.wk:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.cal-cell.out{opacity:.45}
.cal-cell .dn{font:600 12px 'Golos Text';width:24px;height:24px;display:grid;place-items:center;
  border-radius:8px;margin-bottom:2px}
.cal-cell.today .dn{background:var(--accent);color:#fff;box-shadow:0 4px 10px -4px rgba(255,90,45,.7)}
.ev{display:flex;border:0;border-left:3px solid;cursor:pointer;font:500 10.5px 'Golos Text';
  padding:3px 6px;border-radius:6px;margin-top:4px;width:100%;text-align:left;
  overflow:hidden;white-space:nowrap;transition:.12s}
.ev b{overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev:hover{transform:translateX(2px);filter:saturate(1.2)}
.ev.done{opacity:.55}
.ev.done b{text-decoration:line-through}
.more{font:600 10px 'Golos Text';color:var(--mut);margin-top:3px;padding-left:2px}

/* analytics */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);
  padding:18px 20px;animation:rise .45s both}
.panel h4{font:600 12px 'Unbounded';text-transform:uppercase;letter-spacing:.08em;margin-bottom:15px;display:flex;align-items:center;gap:8px}
.arow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.arow:last-child{margin-bottom:0}
.arow .al{width:94px;font:600 12px 'Golos Text';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .track{height:8px}
.arow .av{font:700 12px 'Unbounded';width:26px;text-align:right}
.pnote{font-size:11px;color:var(--mut);margin-top:12px}
.drow{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dleg{display:flex;flex-direction:column;gap:9px}
.dleg-r{display:flex;align-items:center;gap:8px;font:500 12.5px 'Golos Text'}
.dleg-r b{margin-left:auto;font:700 12px 'Unbounded';padding-left:18px}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:6px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--green);opacity:.92;
  transition:height .6s cubic-bezier(.2,.7,.3,1)}
.bars i.z{background:var(--track)}
.blabels{display:flex;justify-content:space-between;font:600 10.5px 'Golos Text';color:var(--mut);margin-top:8px}

/* files */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;
  flex-direction:column;gap:10px;box-shadow:var(--sh-sm);transition:.18s;animation:pop .4s both;cursor:pointer}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.ftop{display:flex;gap:11px;align-items:center}
.ftile{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  font:700 10px 'Golos Text';color:#fff;letter-spacing:.06em;flex:0 0 auto}
.fname{font:600 12.5px/1.35 'Golos Text';word-break:break-word}
.fmeta{font-size:11px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:5px}
.ftags{display:flex;gap:6px;flex-wrap:wrap}
.ftag{font:600 10px 'Golos Text';padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mut)}
.flink{display:inline-flex;align-items:center;gap:6px;font:600 11px 'Golos Text';color:var(--blue);
  background:color-mix(in srgb,#2E6BFF 12%,transparent);padding:6px 10px;border-radius:8px;cursor:pointer;
  border:0;transition:.15s;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.flink:hover{background:color-mix(in srgb,#2E6BFF 19%,transparent);transform:translateX(2px)}
.uprog{display:flex;align-items:center;gap:10px;height:42px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:0 14px;box-shadow:var(--sh-sm)}
.uprog .track{width:130px;height:6px}
.uprog .track i{background:var(--accent)}
.uprog b{font:700 11px 'Unbounded';width:38px}

/* templates view */
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tplcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;
  box-shadow:var(--sh-sm);transition:.18s;animation:pop .4s both;cursor:pointer;
  display:flex;flex-direction:column;gap:10px}
.tplcard:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--accent)}
.tplcard h5{font:600 14px 'Golos Text';margin:0}
.tplcard p{font:500 12px 'Golos Text';color:var(--mut);line-height:1.4;margin:0}
.tplcard .tplmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tplcard .tplactions{display:flex;gap:8px;margin-top:auto}

/* feed */
.feed{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);
  overflow:hidden;animation:rise .4s both}
.fday{padding:10px 18px 8px;font:600 10.5px 'Golos Text';letter-spacing:.15em;text-transform:uppercase;
  color:var(--mut);background:var(--soft2);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.fitem{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--line2);animation:fade .35s both}
.fitem:last-child{border-bottom:0}
.fic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.fitem p{font-size:13px;line-height:1.45;padding-top:4px;min-width:0;flex:1;word-break:break-word}
.fitem time{margin-left:auto;font:500 11px 'Golos Text';color:var(--mut);white-space:nowrap;padding-top:6px;flex:0 0 auto}

/* admin */
.apanel h4{display:flex;align-items:center;gap:8px}
.arow2{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;transition:.15s;min-width:0}
.arow2:hover{background:var(--soft2)}
.aname{font:600 13px 'Golos Text';display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asub{font-size:11px;color:var(--mut)}
.ibtn{border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  cursor:pointer;color:var(--mut);transition:.15s;flex:0 0 auto}
.ibtn:hover{background:color-mix(in srgb,#E5484D 14%,transparent);color:var(--red)}
.rolesel{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:600 11px 'Golos Text';
  background:var(--card);color:var(--ink);cursor:pointer;outline:none;margin-left:auto;flex:0 0 auto}
.aadd{display:flex;gap:8px;margin-top:12px}
.aadd input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  font:500 13px 'Golos Text';outline:none;background:var(--field);transition:.15s;min-width:0;color:var(--ink)}
.aadd input:focus{border-color:var(--ink)}
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sw{width:26px;height:26px;border-radius:9px;cursor:pointer;border:2.5px solid transparent;transition:.15s}
.sw:hover{transform:scale(1.1)}
.sw.on{border-color:var(--ink);transform:scale(1.12)}
.you{font:600 9.5px 'Golos Text';background:color-mix(in srgb,#0FA36B 16%,transparent);color:var(--green);
  padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;flex:0 0 auto}
.alogin{display:flex;gap:10px;flex-wrap:wrap}
.alogin button{display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid var(--line);
  background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s;
  font:600 11.5px 'Golos Text';color:var(--mut)}
.alogin button:hover{border-color:var(--ink);transform:translateY(-2px)}
.alogin button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--ink)}
.adata{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.adata div{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.adata b{font:700 17px 'Unbounded';color:var(--ink);display:block;letter-spacing:0}
.abtns{display:flex;gap:10px;flex-wrap:wrap}
.mtext{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.5}

/* lock */
.lock{max-width:540px;margin:40px auto;text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:42px 32px;box-shadow:var(--sh-sm);animation:rise .4s both}
.lock .lic{width:58px;height:58px;border-radius:16px;background:color-mix(in srgb,var(--red) 13%,transparent);
  color:var(--red);display:grid;place-items:center;margin:0 auto 16px}
.lock h3{font:700 18px 'Unbounded';margin-bottom:9px}
.lock p{color:var(--mut);font-size:13px;line-height:1.6}
.lockadmins{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.55);display:grid;place-items:center;
  z-index:50;padding:20px;animation:fade .2s}
.modal{background:var(--card);border-radius:16px;width:min(700px,100%);max-height:92vh;overflow:auto;
  padding:22px 24px;box-shadow:0 34px 70px -24px rgba(0,0,0,.55);position:relative;
  animation:mpop .28s cubic-bezier(.2,.9,.3,1.15)}
.modal.sm{width:min(460px,100%)}
@keyframes mpop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.modal h3{font:700 16px 'Unbounded';margin-bottom:4px}
.mclose{position:absolute;top:16px;right:16px;border:0;background:var(--soft);width:32px;height:32px;
  border-radius:9px;cursor:pointer;color:var(--mut);display:grid;place-items:center;transition:.15s}
.mclose:hover{background:var(--ink);color:var(--paper)}
.f label{display:block;font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.14em;
  color:var(--mut);margin:14px 0 6px}
.f input[type=text],.f textarea,.f select,.f input[type=date]{width:100%;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font:500 14px 'Golos Text';color:var(--ink);background:var(--field);
  outline:none;transition:.15s;font-family:inherit}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:4px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:600 12px 'Golos Text';
  padding:7px 13px;border-radius:99px;cursor:pointer;transition:.15s;font-family:inherit}
.chipsel button:hover{border-color:var(--ink);color:var(--ink)}
.avasel{display:flex;gap:8px;flex-wrap:wrap}
.avasel button{width:36px;height:36px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;
  color:#fff;font:700 11px 'Golos Text';transition:.15s}
.avasel button:hover{transform:translateY(-2px)}
.avasel button.on{border-color:var(--ink);transform:scale(1.1)}
.mfoot{display:flex;gap:10px;margin-top:22px;align-items:center}

/* task types selector (in modal) */
.ttbox{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px;
  background:var(--field);align-items:center;min-height:42px}
.ttbox .ttype{max-width:240px}
.ttbox .ttype button{border:0;background:rgba(255,255,255,.3);border-radius:50%;width:14px;height:14px;
  display:grid;place-items:center;cursor:pointer;color:#fff;margin-left:4px;transition:.12s;flex:0 0 auto}
.ttbox .ttype button:hover{background:rgba(0,0,0,.3)}
.ttadd{display:flex;gap:4px;align-items:center}
.ttadd input{flex:1;border:0;background:transparent;outline:none;font:500 13px 'Golos Text';
  color:var(--ink);min-width:110px;padding:3px 4px}
.ttadd input::placeholder{color:var(--mut)}

/* tagbox (legacy tags) */
.tagbox{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px;
  background:var(--field);align-items:center}
.tagbox input{flex:1;min-width:110px;border:0;background:none;outline:none;font:500 13px 'Golos Text';color:var(--ink)}
.tagchip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border-radius:99px;
  padding:3px 6px 3px 10px;font:600 11px 'Golos Text';color:var(--ink);animation:bpop .25s}

  const b=BOARDS[t.board]?t.board:'main';
  let col=t.col;
  if(!colsOf(b).some(c=>c.id===col)) col=colsOf(b)[0].id;
  let time=t.time||null;
  if(time&&time.run){
    time={s:time.s+Math.min(Math.round((Date.now()-time.run)/1000),7200),run:null};
  }
  return {...t,board:b,col,types:t.types||[],tags:t.tags||[],repeat:t.repeat||'none',time,
    project:t.project||null,pinned:!!t.pinned,fav:!!t.fav};
}

function useCountUp(to){
  const [n,setN]=useState(0); const cur=useRef(0);
  useEffect(()=>{
    const from=cur.current; let raf; const t0=performance.now();
    const step=t=>{const p=Math.min(1,(t-t0)/600), e=1-Math.pow(1-p,3);
      const v=Math.round(from+(to-from)*e); cur.current=v; setN(v);
      if(p<1) raf=requestAnimationFrame(step);};
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[to]);
  return n;
}
const Stat = ({lbl,n,sub,c,alert}) => {
  const v = useCountUp(n);
  return <div className="stat"><div className="lbl">{lbl}</div>

    <div className="sub">{alert?'⚠ ':''}{sub}</div></div>;
};
const Ring = ({pct,size=58}) => {

    <circle cx={size/2} cy={size/2} r={r} stroke="#0FA36B" strokeWidth="7" fill="none" strokeLinecap="round"
      strokeDasharray={c} strokeDashoffset={c*(1-pct)} transform={`rotate(-90 ${size/2} ${size/2})`}
      style={{transition:'stroke-dashoffset .8s ease'}}/>
    <text x="50%" y="53%" dominantBaseline="middle" textAnchor="middle"

};
function Bar({pct,c,h=8}){
  const[w,setW]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setW(pct),80);return()=>clearTimeout(t);},[pct]);
  return <div className="track" style={{height:h}}><i style={{width:w+'%',background:c,transition:'width .7s cubic-bezier(.2,.7,.3,1)'}}/></div>;
}
function Donut({data,size=140,thick=18}){
  const total = data.reduce((s,d)=>s+d.v,0)||1;
  const r=(size-thick)/2, c=2*Math.PI*r; let acc=0;
  return <svg width={size} height={size}>
    {data.map((d,i)=>{
      const frac=d.v/total, len=Math.max(frac*c-2,1.5), off=-acc*c; acc+=frac;
      return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.c} strokeWidth={thick}
        strokeDasharray={`${len} ${c}`} strokeDashoffset={off} transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{transition:'stroke-dasharray .6s'}}/>;
    })}
    <text x="50%" y="48%" dominantBaseline="middle" textAnchor="middle" style={{font:"700 20px 'Unbounded'",fill:'var(--ink)'}}>{total}</text>
    <text x="50%" y="63%" dominantBaseline="middle" textAnchor="middle" style={{font:"500 9px 'Golos Text'",fill:'var(--mut)'}}>открыто</text>
  </svg>;
}
const dueInfo = t => {
  if(isDone(t)) return {cls:'', txt:'✓ '+fmt(pdate(t.due))};
  const dl = daysLeft(t.due);
  if(dl<0)  return {cls:'bad',  txt:`просрочено ${-dl} д`};
  if(dl===0)return {cls:'warn', txt:'сегодня'};
  if(dl===1)return {cls:'warn', txt:'завтра'};
  return {cls: dl<=2?'warn':'', txt: fmt(pdate(t.due))};
};

function Kanban({all,visible,cols,group,hasF,onEdit,onNew,onDropCard,onPin,onFav,onFieldClick,selectedIds,onToggleSelect,onShiftClick}){
  const {cardFields} = useCtx();
  const [dragId,setDragId]=useState(null);
  const [overCol,setOverCol]=useState(null);
  return <div className="board">
    {cols.map((c,ci)=>{
      const list = group==='day' ? visible.filter(t=>bucketOf(t)===c.id) : visible.filter(t=>t.col===c.id);
      const allN = group==='day' ? all.filter(t=>bucketOf(t)===c.id).length : all.filter(t=>t.col===c.id).length;
      return <section key={c.id} className={'col'+(overCol===c.id&&dragId!=null?' over':'')}
          style={{animationDelay:`${ci*70}ms`,borderTopColor:c.c}}
          onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';setOverCol(c.id);}}
          onDragLeave={()=>setOverCol(null)}

        <div className="col-head">
          <span className="col-dot" style={{background:c.c}}/>

        <div className="col-body">
          {list.length===0&&<div className="empty">
            {hasF?'Нет задач по фильтру':'Пока пусто'}
          </div>}
          {list.map((t,i)=>(
            <TaskCard key={t.id} t={t} onEdit={onEdit} onMove={onMove}

              selected={selectedIds.includes(t.id)}

              onShiftClick={onShiftClick}/>
          ))}
        </div>
      </section>;
    })}
  </div>;
}

/* ================= календарь ================= */
function CalendarView({tasks,onEdit,onNew}){
  const {channels} = useCtx();
  const [cur,setCur]=useState(()=>{const d=today();return{y:d.getFullYear(),m:d.getMonth()};});
  const shift=n=>setCur(c=>{const d=new Date(c.y,c.m+n,1);return{y:d.getFullYear(),m:d.getMonth()};});
  const first=new Date(cur.y,cur.m,1);
  const off=(first.getDay()+6)%7;
  const dim=new Date(cur.y,cur.m+1,0).getDate();
  const start=new Date(cur.y,cur.m,1-off);
  const rows=Math.ceil((off+dim)/7);
  const cells=[]; for(let i=0;i<rows*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d);}
  const byDay=d=>tasks.filter(t=>t.due===iso(d));
  const monthN=tasks.filter(t=>{const d=pdate(t.due);return d.getMonth()===cur.m&&d.getFullYear()===cur.y;}).length;
  return <div className="cal">
    <div className="cal-head">
      <button className="cal-nav" onClick={()=>shift(-1)} title="Предыдущий месяц"><Icon d={IC.left} size={15}/></button>
      <button className="cal-nav" onClick={()=>shift(1)} title="Следующий месяц"><Icon d={IC.right} size={15}/></button>
      <h3>{MONTHS[cur.m]} {cur.y}</h3>
      <span className="cal-cnt">{monthN} дедлайн{monthN===1?'':monthN<5?'а':'ов'} в месяце</span>
      <div className="legend">
        {Object.values(channels).map(c=><span key={c.label}><span className="dot" style={{background:c.c}}/>{c.label}</span>)}
      </div>
    </div>
    <div className="cal-grid">
      {DOW.map((d,i)=><div key={d} className={'cal-dow'+(i>=5?' we':'')}>{d}</div>)}
      {cells.map((d,i)=>{
        const evs=byDay(d), out=d.getMonth()!==cur.m, isT=iso(d)===iso(today()), wk=i%7>=5;
        return <div key={i} className={'cal-cell'+(out?' out':'')+(isT?' today':'')+(wk?' wk':'')}
            title="Клик — новая задача на эту дату" onClick={()=>onNew(iso(d))}>
          <span className="dn">{d.getDate()}</span>
          {evs.slice(0,3).map(t=>{const ch=channels[t.ch]||{c:'#98A29B'};
            return <button key={t.id} className={'ev'+(isDone(t)?' done':'')}
              style={{background:cmix(ch.c,16),borderLeftColor:ch.c,color:ch.c}} title={t.title}
              onClick={e=>{e.stopPropagation();onEdit(t);}}><b>{t.title}</b></button>;})}
          {evs.length>3&&<div className="more">+{evs.length-3} ещё</div>}
        </div>;
      })}
    </div>
  </div>;
}

/* ================= аналитика ================= */
function StatsView({tasks}){
  const {channels,members,projects} = useCtx();
  const [bf,setBf]=useState('all');
  const ts = bf==='all'?tasks:tasks.filter(t=>(t.board||'main')===bf);
  const total=ts.length;
  const done=ts.filter(t=>isDone(t)).length;
  const open=ts.filter(t=>!isDone(t));
  const overdue=open.filter(t=>daysLeft(t.due)<0).length;
  const byChannel=Object.entries(channels)
    .map(([k,c])=>({k,c,v:ts.filter(t=>t.ch===k&&!isDone(t)).length})).sort((a,b)=>b.v-a.v);
  const maxCh=Math.max(...byChannel.map(x=>x.v),1);
  const byMember=Object.entries(members)
    .map(([k,m])=>({k,m,open:ts.filter(t=>t.who===k&&!isDone(t)).length})).sort((a,b)=>b.open-a.open);
  const maxM=Math.max(...byMember.map(x=>x.open),1);
  const byProject=Object.entries(projects)
    .filter(([k,p])=>!p.archived)
    .map(([k,p])=>({k,p,open:ts.filter(t=>t.project===k&&!isDone(t)).length,done:ts.filter(t=>t.project===k&&isDone(t)).length}))
    .sort((a,b)=>(b.open+b.done)-(a.open+a.done));
  const maxP=Math.max(...byProject.map(x=>x.open+x.done),1);
  const pr=[['high','#E5484D','Высокий'],['mid','#E8930C','Средний'],['low','#5BA26B','Низкий']]
    .map(([k,c,l])=>({l,c,v:open.filter(t=>t.pr===k).length}));
  const days=[...Array(14)].map((_,i)=>{const d=addDays(i-13);
    return{d,v:ts.filter(t=>isDone(t)&&t.due===iso(d)).length};});
  const maxD=Math.max(...days.map(x=>x.v),1);
  const[on,setOn]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setOn(true),80);return()=>clearTimeout(t);},[]);
  return <>
    <div className="vtool">
      <span>Сводка по задачам команды</span>
      <div className="fchips">
        {[['all','Все доски'],['main','Основная'],['photo','Фото'],['video','Видео']].map(([v,l])=>
          <button key={v} className={'fchip'+(bf===v?' on':'')} onClick={()=>setBf(v)}>{l}</button>)}
      </div>
    </div>
    <section className="stats">
      <Stat lbl="Всего задач" n={total} sub="в выбранном срезе" c="var(--ink)"/>
      <Stat lbl="Готово" n={done} sub={total?`${Math.round(done/total*100)}% от плана`:'—'} c="var(--green)"/>
      <Stat lbl="Открыто" n={open.length} sub="требуют работы" c="var(--blue)"/>
      <Stat lbl="Просрочено" n={overdue} sub={overdue?'разберитесь сегодня':'чисто'} c="var(--red)" alert={overdue>0}/>
    </section>
    <div className="agrid">
      <div className="panel" style={{animationDelay:'60ms'}}>
        <h4>Открытые задачи по каналам</h4>
        {byChannel.map(x=>
          <div className="arow" key={x.k}>
            <span className="al" style={{color:x.c.c}}>{x.c.label}</span>
            <Bar pct={x.v/maxCh*100} c={x.c.c}/>
            <span className="av">{x.v}</span>
          </div>)}
      </div>
      <div className="panel" style={{animationDelay:'120ms'}}>
        <h4>Нагрузка команды</h4>
        {byMember.map(x=>
          <div className="arow" key={x.k}>
            <Avatar id={x.k} size={22}/>
            <span className="al">{x.m.short}</span>
            <Bar pct={x.open/maxM*100} c={x.m.c}/>
            <span className="av">{x.open}</span>
          </div>)}
        <div className="pnote">Открытые задачи на человека · всего готово: {done}</div>
      </div>
      <div className="panel" style={{animationDelay:'180ms'}}>
        <h4>Приоритеты открытых задач</h4>
        <div className="drow">
          <Donut data={pr}/>
          <div className="dleg">
            {pr.map(p=><div key={p.l} className="dleg-r"><span className="dot" style={{background:p.c}}/>{p.l}<b>{p.v}</b></div>)}
          </div>
        </div>
      </div>
      <div className="panel" style={{animationDelay:'240ms'}}>
        <h4>Закрыто по дням · 2 недели</h4>
        <div className="bars">
          {days.map((d,i)=><i key={i} className={d.v?'':'z'} title={`${fmt(d.d)} — ${d.v}`}
            style={{height:on?`${Math.max(6,d.v/maxD*100)}%`:'6%',transitionDelay:`${i*35}ms`}}/>)}
        </div>
        <div className="blabels"><span>{fmt(days[0].d)}</span><span>сегодня</span></div>
      </div>
      <div className="panel" style={{animationDelay:'300ms',gridColumn:'1/-1'}}>
        <h4>По проектам</h4>
        {byProject.map(x=>{
          const total=x.open+x.done;
          const pct=total?x.done/total*100:0;
          return <div className="arow" key={x.k}>
            <span className="dot" style={{background:x.p.c,width:10,height:10}}/>
            <span className="al" style={{color:x.p.c}}>{x.p.name}</span>
            <div className="track" style={{height:8}}>
              <i style={{width:`${(total/maxP)*100}%`,background:cmix(x.p.c,30),position:'relative'}}>
                <i style={{position:'absolute',left:0,top:0,height:'100%',width:`${pct}%`,background:x.p.c}}/>
              </i>
            </div>
            <span className="av" style={{minWidth:50,textAlign:'right'}}>{x.open} / {x.done}</span>
          </div>;
        })}
      </div>
    </div>
  </>;
}

function FilesView({tasks,onOpenTask,toast}){
  const {members,taskTypes} = useCtx();
  const [files,setFiles]=useState(SEED_FILES);
  const [q,setQ]=useState('');
  const [g,setG]=useState('all');
  const [up,setUp]=useState(null);
  const GROUP={mp4:'video',fig:'design',img:'design',xls:'table',doc:'docs',pdf:'docs',zip:'docs'};
  const CHIPS=[['all','Все'],['video','Видео'],['design','Макеты'],['table','Таблицы'],['docs','Документы']];
  const list=files.filter(f=>(g==='all'||GROUP[f.type]===g) &&
    (!q.trim()||(f.name+' '+(f.types||[]).join(' ')).toLowerCase().includes(q.trim().toLowerCase())));
  const startUpload=()=>{
    if(up!==null) return; let p=0; setUp(0);
    const iv=setInterval(()=>{
      p+=10+Math.random()*16;
      if(p>=100){clearInterval(iv);setUp(null);
        setFiles(f=>[{id:'f'+Date.now(),name:'Баннер_летняя_акция.png',type:'img',size:'2,4 МБ',
          who:'ak',ts:Date.now(),types:['creative']},...f]);
        toast('Файл загружен');
      } else setUp(Math.round(p));
    },140);
  };
  return <>
    <div className="vtool">
      <label className="search" style={{width:230}}>
        <Icon d={IC.search} size={15}/>
        <input placeholder="Поиск по файлам и типам…" value={q} onChange={e=>setQ(e.target.value)}/>
        {q&&<button className="x" onClick={()=>setQ('')}><Icon d={IC.x} size={13}/></button>}
      </label>
      <div className="seg" style={{height:'auto'}}>
        {CHIPS.map(([v,l])=><button key={v} className={g===v?'on':''} onClick={()=>setG(v)}>{l}</button>)}
      </div>
      <span style={{flex:1}}/>
      {up===null
        ? <button className="btn pri" onClick={startUpload}><Icon d={IC.up} size={15} sw={2.2}/>Загрузить файл</button>
        : <div className="uprog"><div className="track"><i style={{width:up+'%'}}/></div><b>{up}%</b></div>}
    </div>
    {list.length===0
      ? <div className="nothing"><b>Файлы не найдены</b>Измените запрос или фильтр типа</div>
      : <div className="fgrid">
        {list.map((f,i)=>{
          const ft=FT[f.type]||{c:'#98A29B',l:'?'};
          const task=f.task&&tasks.find(t=>t.id===f.task);
          return <div key={f.id} className="fcard" style={{animationDelay:`${i*40}ms`}}
              onClick={()=>toast('Демо-режим: скачивание недоступно')}>
            <div className="ftop">
              <span className="ftile" style={{background:ft.c}}>{ft.l}</span>
              <div style={{minWidth:0,flex:1}}>
                <div className="fname">{f.name}</div>
                <div className="fmeta">{f.size} · {fmt(new Date(f.ts))} · {(members[f.who]||{short:'—'}).short}</div>
              </div>
            </div>
            {f.types&&f.types.length>0&&<div className="ftags">{f.types.map(tid=>{
              const tp=taskTypes[tid]; if(!tp) return null;
              return <span key={tid} className="ftag" style={{background:cmix(tp.c,18),color:tp.c}}>{tp.label}</span>;
            })}</div>}
            {task&&<button className="flink" onClick={e=>{e.stopPropagation();onOpenTask(task);}}>
              <Icon d={IC.board} size={12}/>Задача: «{task.title.length>26?task.title.slice(0,26)+'…':task.title}»

/* ================= история ================= */
function FeedView({log,onClear}){
  const dayLabel=k=>{
    if(k===iso(today())) return 'Сегодня';
    if(k===iso(addDays(-1))) return 'Вчера';
    return fmtL(pdate(k));
  };
  const items=[]; let lastK='';
  log.forEach(e=>{const k=iso(new Date(e.ts));
    if(k!==lastK){items.push({day:true,k,label:dayLabel(k)});lastK=k;}
    items.push(e);});
  return <>
    <div className="vtool">
      <span>Все события команды: создание, переносы, повторы, комментарии, админ-действия</span>
      {log.length>0&&<button className="btn ghost" onClick={onClear}>Очистить историю</button>}
    </div>
    {log.length===0
      ? <div className="nothing"><b>История пуста</b>Действия с задачами будут появляться здесь</div>
      : <div className="feed">
        {items.map((e,i)=> e.day
          ? <div key={'d'+e.k} className="fday">{e.label}</div>
          : <div key={e.id} className="fitem" style={{animationDelay:`${Math.min(i,10)*30}ms`}}>
              <span className="fic" style={{background:(LOG_META[e.type]||LOG_META.edit)[1]}}>
                <Icon d={(LOG_META[e.type]||LOG_META.edit)[0]} size={14} sw={2}/>
              </span>
              <p>{e.text}</p>
              <time>{fmtT(e.ts)}</time>
            </div>)}
      </div>}
  </>;
}

/* ================= админ-панель ================= */
function AdminView({tasks,setTasks,channels,setChannels,members,setMembers,me,setMe,sprint,setSprint,
                     projects,setProjects,taskTypes,setTaskTypes,
                     setLog,setChF,setWhoF,logEv,toast,resetDemo}){
  const [newM,setNewM]=useState('');
  const [newCh,setNewCh]=useState('');
  const [newPr,setNewPr]=useState('');
  const [newTT,setNewTT]=useState('');
  const [chColor,setChColor]=useState('#2E6BFF');
  const [prColor,setPrColor]=useState('#FF5A2D');
  const [ttColor,setTtColor]=useState('#2E6BFF');
  const [sp,setSp]=useState({...sprint});
  const [confirm,setConfirm]=useState(null);
  const fileRef=useRef(null);
  const PALETTE=['#FF5A2D','#2E6BFF','#0FA36B','#8B5CF6','#F0447E','#0EA5C6','#E8930C','#5BA26B','#E5484D','#F59E0B'];
  const SWATCH=['#E5484D','#FF8A00','#E8930C','#0FA36B','#0EA5C6','#2E6BFF','#8B5CF6','#F0447E','#141B17','#98A29B'];

  const addMember=()=>{
    const name=newM.trim();
    if(!name){toast('Введите имя сотрудника');return;}
    const parts=name.split(/\s+/);
    const id='u'+Date.now().toString(36);
    const ini=parts.map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const short=parts.length>1?parts[0]+' '+parts[1][0]+'.':name;
    const c=PALETTE[Object.keys(members).length%PALETTE.length];
    setMembers(m=>({...m,[id]:{name,short,ini,c,role:'member'}}));
    setNewM('');
    logEv('admin',`Админ: добавлен сотрудник ${name}`);
    toast(`Сотрудник добавлен: ${name}`);
  };
  const setRole=(k,role)=>{
    setMembers(mm=>({...mm,[k]:{...mm[k],role}}));
    logEv('admin',`Админ: ${members[k].name} теперь ${role==='admin'?'администратор':'участник'}`);
    toast(role==='admin'?'Права администратора выданы':'Права понижены до участника');
  };
  const doDelMember=(k,target)=>{
    const nm=members[k].name;
    setTasks(ts=>target?ts.map(t=>t.who===k?{...t,who:target}:t):ts.filter(t=>t.who!==k));
    setMembers(mm=>{const c={...mm};delete c[k];return c;});
    setWhoF(a=>a.filter(x=>x!==k));
    if(me===k){const rest=Object.keys(members).find(x=>x!==k);setMe(target||rest);}
    logEv('admin',`Админ: удалён сотрудник ${nm}`+(target?' — задачи переданы':''));
    toast('Сотрудник удалён');
  };
  const askDelMember=k=>{
    if(Object.keys(members).length<=1){toast('Нельзя удалить последнего сотрудника');return;}
    const n=tasks.filter(t=>t.who===k).length;
    const others=Object.entries(members).filter(([id])=>id!==k);
    if(n===0){doDelMember(k,null);return;}
    setConfirm({kind:'member',id:k,title:'Удалить сотрудника?',
      text:`У ${members[k].name} осталось задач: ${n}. Выберите, кому их передать.`,
      candidates:others,target:others[0][0]});
  };
  const addChannel=()=>{
    const label=newCh.trim();
    if(!label){toast('Введите название канала');return;}
    const id='c'+Date.now().toString(36);
    setChannels(cs=>({...cs,[id]:{label,c:chColor}}));
    setNewCh('');
    logEv('admin',`Админ: добавлен канал «${label}»`);
    toast(`Канал добавлен: ${label}`);
  };
  const doDelChannel=(k,target)=>{
    const label=channels[k].label;
    setTasks(ts=>target?ts.map(t=>t.ch===k?{...t,ch:target}:t):ts.filter(t=>t.ch!==k));
    setChannels(cs=>{const c={...cs};delete c[k];return c;});
    setChF(a=>a.filter(x=>x!==k));
    logEv('admin',`Админ: удалён канал «${label}»`);
    toast('Канал удалён');
  };
  const askDelChannel=k=>{
    if(Object.keys(channels).length<=1){toast('Нельзя удалить последний канал');return;}
    const n=tasks.filter(t=>t.ch===k).length;
    const others=Object.entries(channels).filter(([id])=>id!==k);
    if(n===0){doDelChannel(k,null);return;}
    setConfirm({kind:'channel',id:k,title:'Удалить канал?',
      text:`В канале «${channels[k].label}» задач: ${n}. Выберите канал для переноса.`,
      candidates:others,target:others[0][0]});
  };
  const addProject=()=>{
    const name=newPr.trim();
    if(!name){toast('Введите название проекта');return;}
    const id='pr'+Date.now().toString(36);
    setProjects(ps=>({...ps,[id]:{name,c:prColor,goal:'',archived:false}}));
    setNewPr('');
    logEv('admin',`Админ: создан проект «${name}»`);
    toast(`Проект создан: ${name}`);
  };
  const delProject=k=>{
    const n=tasks.filter(t=>t.project===k).length;
    const name=projects[k].name;
    setTasks(ts=>ts.map(t=>t.project===k?{...t,project:null}:t));
    setProjects(ps=>{const c={...ps};delete c[k];return c;});
    logEv('admin',`Админ: удалён проект «${name}»`);
    toast(`Проект удалён${n?', задачи отвязаны':''}`);
  };
  const toggleArchiveProject=k=>{
    setProjects(ps=>({...ps,[k]:{...ps[k],archived:!ps[k].archived}}));
    toast(projects[k].archived?'Проект возвращён в активные':'Проект архивирован');
  };
  const addTaskType=()=>{
    const label=newTT.trim();
    if(!label){toast('Введите название типа');return;}
    const id='tt'+Date.now().toString(36);
    setTaskTypes(tt=>({...tt,[id]:{label,c:ttColor}}));
    setNewTT('');
    logEv('admin',`Админ: создан тип задачи «${label}»`);
    toast(`Тип создан: ${label}`);
  };
  const delTaskType=k=>{
    const label=taskTypes[k].label;
    setTasks(ts=>ts.map(t=>({...t,types:(t.types||[]).filter(x=>x!==k)})));
    setTaskTypes(tt=>{const c={...tt};delete c[k];return c;});
    logEv('admin',`Админ: удалён тип задачи «${label}»`);
    toast(`Тип «${label}» удалён`);
  };
  const saveSprint=()=>{
    if(!sp.name.trim()){toast('Введите название');return;}
    if(pdate(sp.start)>pdate(sp.end)){toast('Начало позже конца');return;}
    setSprint({...sp,name:sp.name.trim()});
    logEv('admin','Админ: обновлена кампания');
    toast('Настройки сохранены');
  };
  const kb=useMemo(()=>{
    try{return Math.max(1,Math.round(new Blob([JSON.stringify({tasks,channels,members,sprint,projects,taskTypes})]).size/1024));}
    catch(e){return 0;}
  },[tasks,channels,members,sprint,projects,taskTypes]);
  const doExport=()=>{
    const data=JSON.stringify({v:3,tasks,channels,members,me,sprint,projects,taskTypes},null,2);
    const blob=new Blob([data],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='potok-backup-'+iso(today())+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    logEv('admin','Админ: экспортирован бэкап данных');
    toast('Бэкап экспортирован');
  };
  const doImport=e=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const p=JSON.parse(reader.result);
        if(!p||!Array.isArray(p.tasks)) throw new Error('bad');
        setTasks(p.tasks.map(normTask));
        if(p.channels&&Object.keys(p.channels).length) setChannels(p.channels);
        if(p.members&&Object.keys(p.members).length){
          setMembers(Object.fromEntries(Object.entries(p.members).map(([k,v])=>[k,{role:'member',...v}])));
          setMe(p.me&&p.members[p.me]?p.me:Object.keys(p.members)[0]);
        }
        if(p.projects) setProjects(p.projects);
        if(p.taskTypes) setTaskTypes(p.taskTypes);
        if(p.sprint) setSprint(p.sprint);
        setLog(()=>Array.isArray(p.log)?p.log:[]);
        toast('Данные импортированы');
      }catch(err){toast('Не удалось импортировать файл');}
    };
    reader.readAsText(file);
  };
  const doConfirm=()=>{
    if(confirm.kind==='member') doDelMember(confirm.id,confirm.candidates?confirm.target:null);
    if(confirm.kind==='channel') doDelChannel(confirm.id,confirm.candidates?confirm.target:null);
    if(confirm.kind==='clear'){setTasks([]);logEv('admin','Админ: очищены все задачи');toast('Все задачи удалены');}
    setConfirm(null);
  };

  const activeProjects=Object.entries(projects).filter(([k,p])=>!p.archived);
  const archivedProjects=Object.entries(projects).filter(([k,p])=>p.archived);

  return <>
    <div className="agrid">
      <div className="panel apanel">
        <h4><Icon d={IC.user} size={14}/>Команда и роли</h4>
        {Object.entries(members).map(([k,m])=>
          <div key={k} className="arow2">
            <Avatar id={k} size={30}/>
            <div style={{minWidth:0,flex:1}}>
              <div className="aname">{m.name}{k===me&&<span className="you">вы</span>}</div>
              <div className="asub">{tasks.filter(t=>t.who===k&&!isDone(t)).length} открытых задач</div>
            </div>
            <select className="rolesel" value={m.role||'member'} onChange={e=>setRole(k,e.target.value)} title="Роль">
              <option value="admin">админ</option>
              <option value="member">участник</option>
            </select>
            <button className="ibtn" title="Удалить" onClick={()=>askDelMember(k)}><Icon d={IC.trash} size={14}/></button>
          </div>)}
        <div className="aadd">
          <input placeholder="Имя Фамилия нового сотрудника…" value={newM}
            onChange={e=>setNewM(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addMember()}/>
          <button className="btn pri" style={{height:40}} onClick={addMember}><Icon d={IC.plus} size={14} sw={2.4}/>Добавить</button>
        </div>
      </div>

      <div className="panel apanel" style={{animationDelay:'60ms'}}>
        <h4><Icon d={IC.board} size={14}/>Каналы</h4>
        {Object.entries(channels).map(([k,c])=>
          <div key={k} className="arow2">
            <span className="dot" style={{background:c.c,width:12,height:12}}/>
            <div style={{minWidth:0,flex:1}}>
              <div className="aname">{c.label}</div>
              <div className="asub">{tasks.filter(t=>t.ch===k&&!isDone(t)).length} открытых задач</div>
            </div>
            <button className="ibtn" title="Удалить" onClick={()=>askDelChannel(k)}><Icon d={IC.trash} size={14}/></button>
          </div>)}
        <div className="aadd">
          <input placeholder="Название нового канала…" value={newCh}
            onChange={e=>setNewCh(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addChannel()}/>
          <button className="btn pri" style={{height:40}} onClick={addChannel}><Icon d={IC.plus} size={14} sw={2.4}/>Добавить</button>
        </div>
        <div className="swatches">
          {SWATCH.map(c=><button key={c} className={'sw'+(chColor===c?' on':'')}
            style={{background:c}} onClick={()=>setChColor(c)} title={c}/>)}
        </div>
      </div>

      <div className="panel apanel" style={{animationDelay:'120ms',gridColumn:'1/-1'}}>
        <h4><Icon d={IC.target} size={14}/>Проекты</h4>
        {activeProjects.map(([k,p])=>
          <div key={k} className="arow2">
            <span className="dot" style={{background:p.c,width:12,height:12}}/>
            <div style={{minWidth:0,flex:1}}>
              <div className="aname">{p.name}</div>
              <div className="asub">{tasks.filter(t=>t.project===k&&!isDone(t)).length} открытых · {p.goal||'без цели'}</div>
            </div>
            <button className="ibtn" title="Архивировать" onClick={()=>toggleArchiveProject(k)}>
              <Icon d={IC.folder} size={14}/>
            </button>
            <button className="ibtn" title="Удалить" onClick={()=>delProject(k)}><Icon d={IC.trash} size={14}/></button>
          </div>)}
        {archivedProjects.length>0&&<>
          <div className="asub" style={{padding:'8px 8px 4px'}}>Архив</div>
          {archivedProjects.map(([k,p])=>
            <div key={k} className="arow2" style={{opacity:.6}}>
              <span className="dot" style={{background:p.c,width:12,height:12}}/>
              <div style={{minWidth:0,flex:1}}>
                <div className="aname">{p.name}</div>
                <div className="asub">в архиве</div>
              </div>
              <button className="ibtn" title="Вернуть" onClick={()=>toggleArchiveProject(k)}>
                <Icon d={IC.redo} size={14}/>
              </button>
            </div>)}
        </>}
        <div className="aadd">
          <input placeholder="Название нового проекта…" value={newPr}
            onChange={e=>setNewPr(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addProject()}/>
          <button className="btn pri" style={{height:40}} onClick={addProject}><Icon d={IC.plus} size={14} sw={2.4}/>Создать</button>
        </div>
        <div className="swatches">
          {SWATCH.map(c=><button key={c} className={'sw'+(prColor===c?' on':'')}
            style={{background:c}} onClick={()=>setPrColor(c)} title={c}/>)}
        </div>
      </div>

      <div className="panel apanel" style={{animationDelay:'180ms',gridColumn:'1/-1'}}>
        <h4><Icon d={IC.template} size={14}/>Типы задач</h4>
        <p className="asub" style={{marginBottom:10}}>Цветные метки для классификации задач. Можно создавать свои типы.</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:12}}>
          {Object.entries(taskTypes).map(([k,tp])=>
            <div key={k} className="arow2" style={{padding:0,background:'transparent'}}>
              <span className="ttype" style={{background:tp.c}}>
                {tp.label}
                <button onClick={()=>delTaskType(k)} style={{border:0,background:'rgba(255,255,255,.3)',
                  borderRadius:'50%',width:14,height:14,display:'grid',placeItems:'center',cursor:'pointer',
                  color:'#fff',marginLeft:4}} title="Удалить тип">
                  <Icon d={IC.x} size={9}/>
                </button>
              </span>
            </div>)}
        </div>
        <div className="aadd">
          <input placeholder="Название нового типа…" value={newTT}
            onChange={e=>setNewTT(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTaskType()}/>
          <button className="btn pri" style={{height:40}} onClick={addTaskType}><Icon d={IC.plus} size={14} sw={2.4}/>Создать тип</button>
        </div>
        <div className="swatches">
          {SWATCH.map(c=><button key={c} className={'sw'+(ttColor===c?' on':'')}
            style={{background:c}} onClick={()=>setTtColor(c)} title={c}/>)}
        </div>
      </div>

      <div className="panel apanel" style={{animationDelay:'240ms'}}>
        <h4><Icon d={IC.cal} size={14}/>Кампания / период</h4>
        <p className="asub" style={{marginBottom:8}}>Необязательный контекст для команды — название и срок текущей кампании.</p>
        <div className="f" style={{marginTop:-6}}>
          <label>Название</label>
          <input type="text" value={sp.name} onChange={e=>setSp(s=>({...s,name:e.target.value}))}/>
          <label>Цель кампании</label>
          <input type="text" placeholder="Например: +30% регистраций" value={sp.goal||''} onChange={e=>setSp(s=>({...s,goal:e.target.value}))}/>
          <div className="frow">
            <div><label>Начало</label><input type="date" value={sp.start} onChange={e=>setSp(s=>({...s,start:e.target.value}))}/></div>
            <div><label>Конец</label><input type="date" value={sp.end} onChange={e=>setSp(s=>({...s,end:e.target.value}))}/></div>
          </div>
        </div>
        <div style={{marginTop:14,display:'flex',alignItems:'center',gap:12}}>
          <button className="btn pri" style={{height:40}} onClick={saveSprint}>Сохранить</button>
          <span className="asub">До конца: {Math.max(0,Math.round((pdate(sp.end)-today())/DAY))} дн.</span>
        </div>
      </div>

      <div className="panel apanel" style={{animationDelay:'300ms'}}>
        <h4><Icon d={IC.shield} size={14}/>Войти как</h4>
        <p className="asub" style={{marginBottom:12}}>«Мои задачи» и комментарии — от имени выбранного сотрудника. Админ-панель доступна только администраторам.</p>
        <div className="alogin">
          {Object.entries(members).map(([k,m])=>
            <button key={k} className={me===k?'on':''} onClick={()=>{
              setMe(k);
              logEv('admin',`Админ: вошли как ${m.name}`);
              toast(`Вы вошли как ${m.name}`);
            }}>
              <Avatar id={k} size={34}/>{m.short}{m.role==='admin'?' · админ':''}
            </button>)}
        </div>
      </div>

      <div className="panel apanel" style={{gridColumn:'1/-1',animationDelay:'360ms'}}>
        <h4><Icon d={IC.folder} size={14}/>Данные</h4>
        <div className="adata">
          <div><b>{tasks.length}</b>задач</div>
          <div><b>{Object.keys(members).length}</b>сотрудников</div>
          <div><b>{Object.keys(channels).length}</b>каналов</div>
          <div><b>{Object.keys(projects).length}</b>проектов</div>
          <div><b>{Object.keys(taskTypes).length}</b>типов</div>
          <div><b>{kb} КБ</b>в localStorage</div>
        </div>
        <div className="abtns">
          <button className="btn ghost" onClick={doExport}><Icon d={IC.up} size={14}/>Экспорт JSON</button>
          <button className="btn ghost" onClick={()=>fileRef.current&&fileRef.current.click()}><Icon d={IC.right} size={14}/>Импорт JSON</button>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={doImport}/>
          <button className="btn danger" onClick={()=>setConfirm({kind:'clear',title:'Удалить все задачи?',
            text:`Будет удалено задач: ${tasks.length}. Действие необратимо (без бэкапа).`})}>
            <Icon d={IC.trash} size={14}/>Очистить задачи
          </button>
          <button className="btn danger" onClick={resetDemo}><Icon d={IC.redo} size={14}/>Сбросить демо</button>
        </div>
      </div>
    </div>

    {confirm&&<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setConfirm(null);}}>
      <div className="modal" style={{width:'min(460px,100%)'}}>
        <h3>{confirm.title}</h3>
        <p className="mtext">{confirm.text}</p>
        {confirm.candidates&&<div className="f"><label>Передать задачи</label>
          <select value={confirm.target} onChange={e=>setConfirm(c=>({...c,target:e.target.value}))}>
            {confirm.candidates.map(([id,x])=><option key={id} value={id}>{x.name||x.label}</option>)}
          </select></div>}
        <div className="mfoot">
          <span style={{flex:1}}/>
          <button className="btn ghost" onClick={()=>setConfirm(null)}>Отмена</button>
          <button className="btn danger" onClick={doConfirm}>Удалить</button>
        </div>
      </div>
    </div>}
  </>;
}

/* ================= локскрин ================= */
function LockScreen({login}){
  const {members,me} = useCtx();
  const admins = Object.entries(members).filter(([k,m])=>m.role==='admin');
  return <div className="lock">
    <div className="lic"><Icon d={IC.shield} size={26}/></div>
    <h3>Недостаточно прав</h3>
    <p>Админ-панель доступна только администраторам.<br/>
       Вы вошли как <b>{(members[me]||{name:'—'}).name}</b> · роль «участник».<br/>
       Переключитесь на администратора, чтобы продолжить:</p>
    <div className="lockadmins">
      {admins.length===0&&<span className="asub">Администраторов нет</span>}
      {admins.map(([k,m])=><button key={k} className="btn ghost" onClick={()=>login(k)}>
        <Avatar id={k} size={22}/>{m.short}
      </button>)}
    </div>
  </div>;
}

/* ================= настройки карточки ================= */
function CardSettings({cardFields,setCardFields,onClose}){
  const FIELDS = [
    ['channel','Канал','Показывать чип канала маркетинга',IC.board],
    ['assignee','Исполнитель','Аватар и имя ответственного',IC.user],
    ['priority','Приоритет','Индикатор важности задачи',IC.flagOutline],
    ['due','Дедлайн','Срок выполнения задачи',IC.cal],
    ['desc','Описание','Краткий текст задачи',IC.note],
    ['types','Типы задач','Цветные метки типа',IC.template],
    ['project','Проект','Привязка к проекту',IC.target],
    ['subtasks','Чек-лист','Прогресс подзадач',IC.check],
    ['comments','Комментарии','Счётчик комментариев',IC.chat],
    ['timer','Таймер','Учёт времени',IC.clock],
  ];
  const allOn = FIELDS.every(([k])=>cardFields[k]);
  const toggleAll=()=>{
    const next={}; FIELDS.forEach(([k])=>next[k]=!allOn);
    setCardFields(next);
  };
  return <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal sm">
      <button className="mclose" onClick={onClose}><Icon d={IC.x} size={16}/></button>
      <h3>Вид карточки</h3>
      <p className="asub" style={{marginBottom:12}}>Выберите, какие поля показывать на карточках задач.</p>
      <div className="csrow" style={{borderBottom:'1.5px solid var(--line)'}}>
        <div className="csi">
          <div className="ic"><Icon d={IC.cog} size={16}/></div>
